<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Edit Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    :root{
      --bg:#f5f5f5;
      --card:#fff;
      --line:#e5e5e5;
      --text:#111;
      --muted:#666;
      --shadow:0 10px 24px rgba(0,0,0,.08);
      --radius:18px;
      --accent:#111;
      --danger:#b42318;
      --danger-bg:#fff2f0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .container{
      width:min(1100px, calc(100% - 24px));
      margin:22px auto 40px;
      background:var(--card);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:22px 18px 28px;
      position:relative;
    }
    .page-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .title-wrap{min-width:0}
    h1{margin:0;font-size:44px;letter-spacing:-1px}
    .sub{margin:8px 0 0;color:var(--muted);font-size:14px}
    .btn{
      appearance:none;
      border:1px solid #d8d8d8;
      background:#fafafa;
      color:#111;
      border-radius:14px;
      padding:10px 14px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn.primary{background:#111;color:#fff;border-color:#111}
    .btn.danger{background:var(--danger-bg);color:var(--danger);border-color:#f4b4ad}
    .btn.small{padding:8px 12px;font-size:13px}
    .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .fab{
      position:fixed;top:20px;right:20px;width:58px;height:58px;border-radius:18px;border:none;
      background:#111;color:#fff;font-size:34px;line-height:1;cursor:pointer;
      box-shadow:0 12px 24px rgba(0,0,0,.18);z-index:25;
    }
    .toolbar{
      display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
      margin:8px 0 18px;
    }
    .count-pill{
      display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;
      background:#fafafa;border:1px solid var(--line);font-size:13px;color:#333;font-weight:700;
    }
    .jobs-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:14px}
    .job-card{
      border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04);
      padding:16px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    }
    .job-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
    .job-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
    .job-card h2{margin:0;font-size:24px;line-height:1.1}
    .job-chip{
      display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid #ddd;
      background:#fafafa;font-size:12px;font-weight:700;white-space:nowrap;
    }
    .job-meta{display:grid;gap:8px;margin-bottom:10px}
    .job-meta-row{font-size:14px;color:#222}
    .job-meta-row strong{color:#111}
    .inventory-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
    .inventory-view{
      display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid #f0f0f0;padding-top:8px;
    }
    .empty{
      padding:28px;text-align:center;color:#666;border:1px dashed #d9d9d9;border-radius:18px;background:#fcfcfc;
    }
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.24);display:none;z-index:30;
    }
    .overlay.show{display:block}
    .sheet{
      position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:#fff;
      box-shadow:-12px 0 30px rgba(0,0,0,.18);transform:translateX(100%);
      transition:transform .18s ease;z-index:35;display:flex;flex-direction:column;
    }
    .sheet.open{transform:translateX(0)}
    .sheet-head{
      padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;
      justify-content:space-between;align-items:flex-start;gap:12px;
    }
    .sheet-head h2{margin:0;font-size:30px;letter-spacing:-0.6px}
    .sheet-head p{margin:6px 0 0;color:#666;font-size:13px}
    .sheet-body{padding:16px 18px 24px;overflow:auto}
    .form-grid{display:grid;gap:14px}
    .row{display:grid;gap:8px}
    .row label{font-weight:700;font-size:14px}
    input[type="text"],input[type="date"],input[type="number"],select,textarea{
      width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:14px;font-size:15px;
      font-family:inherit;background:#fff;outline:none;
    }
    textarea{resize:none;min-height:48px;overflow:hidden;line-height:1.45}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .inv-card{
      border:1px solid var(--line);border-radius:16px;padding:12px;background:#fcfcfc;display:grid;gap:10px;
    }
    .inv-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .emp-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:10px}
    .emp-toggle{
      display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;
      font-size:14px;font-weight:700;
    }
    .emp-toggle input{width:18px;height:18px;accent-color:#111;margin:0}
    .sheet-actions{
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
    }
    .left-actions,.right-actions{display:flex;gap:10px;flex-wrap:wrap}
    .msg{margin-top:10px;font-size:14px;font-weight:700}
    .msg.error{color:#b42318}
    .msg.ok{color:#166534}
    .muted{color:#666;font-size:13px}
    @media (max-width:640px){
      .container{width:min(100%, calc(100% - 14px));padding:16px 12px 22px}
      h1{font-size:34px}
      .fab{width:52px;height:52px;font-size:30px;top:14px;right:14px;border-radius:16px}
      .two-col{grid-template-columns:1fr}
      .sheet-head h2{font-size:26px}
      .jobs-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <button class="fab" id="newJobBtn" aria-label="New job">+</button>

  <div class="container">
    <div class="page-top">
      <div class="title-wrap">
        <h1>Edit Jobs</h1>
        <p class="sub">Create, edit, and delete jobs. This page shows all active jobs regardless of employee assignment.</p>
      </div>
      <div class="top-actions">
        <a href="admin.html" class="btn small">← Back to Admin</a>
        <button id="refreshBtn" class="btn small">Refresh</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="count-pill">Active jobs: <span id="jobCount">0</span></div>
      <div class="muted" id="statusLine">Loading jobs…</div>
    </div>

    <div id="jobsGrid" class="jobs-grid"></div>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="sheet" id="sheet">
    <div class="sheet-head">
      <div>
        <h2 id="sheetTitle">New Job</h2>
        <p id="sheetSub"></p>
      </div>
      <button class="btn small" id="closeSheetBtn">Close</button>
    </div>
    <div class="sheet-body">
      <form id="jobForm" class="form-grid">
        <div class="row">
          <label for="jobName">Job Name</label>
          <textarea id="jobName" rows="1" placeholder="Enter the job name"></textarea>
        </div>

        <div class="two-col">
          <div class="row">
            <label for="jobType">Type</label>
            <select id="jobType">
              <option value="Set-Up">Set-Up</option>
              <option value="Pickup">Pickup</option>
              <option value="Delivery">Delivery</option>
            </select>
          </div>
          <div class="row" id="addressRow">
            <label for="jobAddress">Address</label>
            <textarea id="jobAddress" rows="1" placeholder="Enter the address"></textarea>
          </div>
        </div>

        <div class="row">
          <label for="jobNotes">Notes</label>
          <textarea id="jobNotes" rows="1" placeholder="Enter notes"></textarea>
        </div>

        <div class="two-col">
          <div class="row">
            <label for="startDate">Start Date</label>
            <input id="startDate" type="date" />
          </div>
          <div class="row">
            <label for="strikeDate">Strike Date</label>
            <input id="strikeDate" type="date" />
          </div>
        </div>

        <div class="row">
          <label>Employees Working</label>
          <div id="employeeToggles" class="emp-grid"></div>
          <div class="muted">Employee names are read live from column J on Sheet2.</div>
        </div>

        <div class="row">
          <label>Inventory</label>
          <div id="inventoryWrap"></div>
          <button type="button" class="btn small" id="addInventoryBtn">+ Add Inventory Row</button>
        </div>

        <div class="sheet-actions">
          <div class="left-actions">
            <button type="button" class="btn danger" id="deleteJobBtn" style="display:none;">Delete Entire Job</button>
          </div>
          <div class="right-actions">
            <button type="button" class="btn" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn primary" id="saveBtn">Save Job</button>
          </div>
        </div>

        <div id="formMsg" class="msg" style="display:none;"></div>
      </form>
    </div>
  </aside>

  <script>
    const JOBS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwNF2_ONYCYHpxL6g38W4USrsGN6oSdk3sjibl11Gn0F4NYAgztas1AZzcK00Tpias/exec";

    const state = { employees: [], jobs: [], editingJob: null };

    function autoGrow(el){
      if (!el) return;
      el.style.height = "auto";
      el.style.height = Math.max(el.scrollHeight, 48) + "px";
    }

    function setStatus(msg){ document.getElementById("statusLine").textContent = msg || ""; }

    function setFormMsg(msg, isError){
      const el = document.getElementById("formMsg");
      if (!msg){
        el.style.display = "none";
        el.textContent = "";
        el.className = "msg";
        return;
      }
      el.style.display = "block";
      el.textContent = msg;
      el.className = "msg " + (isError ? "error" : "ok");
    }

    function jsonp(url, params, timeoutMs=15000){
      return new Promise((resolve, reject)=>{
        const cbName = "cb_" + Math.random().toString(16).slice(2);
        const u = new URL(url);
        Object.keys(params || {}).forEach(k=>u.searchParams.set(k, params[k]));
        u.searchParams.set("callback", cbName);

        let done = false;
        const script = document.createElement("script");
        const timer = setTimeout(()=>{
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("Web app timeout. Check the /exec URL and deployment access."));
        }, timeoutMs);

        function cleanup(){
          clearTimeout(timer);
          script.remove();
          try{ delete window[cbName]; }catch(_){}
        }

        window[cbName] = (data)=>{
          if (done) return;
          done = true;
          cleanup();
          if (data && data.ok === false && data.error) reject(new Error(String(data.error)));
          else resolve(data);
        };

        script.onerror = ()=>{
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("JSONP request failed. Check Apps Script deployment access."));
        };

        script.src = u.toString();
        document.body.appendChild(script);
      });
    }

    function toTitleCaseWords(s){
      return String(s || "").toLowerCase().replace(/\b([a-z])/g, function(m){ return m.toUpperCase(); });
    }

    function syncTypeVisibility(){
      var type = (document.getElementById("jobType").value || "").toLowerCase();
      var row = document.getElementById("addressRow");
      if (!row) return;
      row.style.display = (type === "pickup") ? "none" : "";
      if (type === "pickup") {
        document.getElementById("jobAddress").value = "";
        autoGrow(document.getElementById("jobAddress"));
      }
    }

    function formatDatePretty(yyyyMmDd){
      if (!yyyyMmDd) return "—";
      const parts = String(yyyyMmDd).split("-");
      if (parts.length !== 3) return yyyyMmDd;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      return days[d.getDay()] + ": " + (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
    }

    function formatJobDate(startDate, strikeDate){
      if (startDate && strikeDate){
        const sd = new Date(startDate);
        if (startDate === strikeDate) return (sd.getMonth()+1) + "/" + sd.getDate() + "/" + sd.getFullYear() + " - SAME DAY STRIKE";
        return formatDatePretty(startDate) + " - " + formatDatePretty(strikeDate);
      }
      return startDate ? formatDatePretty(startDate) : (strikeDate ? formatDatePretty(strikeDate) : "—");
    }

    function ensureInventoryRow(item = {}){
      const wrap = document.getElementById("inventoryWrap");
      const card = document.createElement("div");
      card.className = "inv-card";
      card.innerHTML = `
        <div class="inv-head">
          <strong>Inventory Item</strong>
          <button type="button" class="btn danger small delete-item-btn">Delete</button>
        </div>
        <div class="two-col">
          <div class="row">
            <label>Inventory</label>
            <textarea class="inv-text" rows="1" placeholder="Inventory item">${item.inventory || ""}</textarea>
          </div>
          <div class="row">
            <label>Quantity</label>
            <input class="inv-qty" type="number" inputmode="numeric" min="0" step="1" value="${item.quantity || ""}" />
          </div>
        </div>
      `;
      wrap.appendChild(card);

      const txt = card.querySelector(".inv-text");
      autoGrow(txt);
      txt.addEventListener("input", ()=>autoGrow(txt));

      card.querySelector(".delete-item-btn").addEventListener("click", ()=>{
        card.remove();
        if (!wrap.children.length) ensureInventoryRow();
      });
    }

    function renderEmployeeToggles(selected){
      const wrap = document.getElementById("employeeToggles");
      wrap.innerHTML = "";
      const chosen = new Set(selected || []);
      (state.employees || []).forEach(name=>{
        const label = document.createElement("label");
        label.className = "emp-toggle";
        label.innerHTML = `<input type="checkbox" value="${name}" ${chosen.has(name) ? "checked" : ""}> <span>${name}</span>`;
        wrap.appendChild(label);
      });
    }

    function openSheet(job){
      state.editingJob = job || null;
      document.getElementById("sheet").classList.add("open");
      document.getElementById("overlay").classList.add("show");
      document.getElementById("sheetTitle").textContent = job ? "Edit Job" : "New Job";
      document.getElementById("sheetSub").textContent = job ? ("Editing " + (job.jobName || "job")) : "";
      document.getElementById("deleteJobBtn").style.display = job ? "" : "none";
      setFormMsg("", false);

      document.getElementById("jobName").value = job ? (job.jobName || "") : "";
      document.getElementById("jobType").value = job ? (job.type || "Set-Up") : "Set-Up";
      document.getElementById("startDate").value = job ? (job.startDate || "") : "";
      document.getElementById("strikeDate").value = job ? (job.strikeDate || "") : "";
      document.getElementById("jobAddress").value = job ? (job.address || "") : "";
      document.getElementById("jobNotes").value = job ? (job.notes || "") : "";

      ["jobName","jobAddress","jobNotes"].forEach(id=>{
        const el = document.getElementById(id);
        autoGrow(el);
      });

      renderEmployeeToggles(job ? (job.employees || []) : []);
      syncTypeVisibility();

      const invWrap = document.getElementById("inventoryWrap");
      invWrap.innerHTML = "";
      const items = job && job.inventory && job.inventory.length ? job.inventory : [{inventory:"", quantity:""}];
      items.forEach(ensureInventoryRow);
    }

    function closeSheet(){
      document.getElementById("sheet").classList.remove("open");
      document.getElementById("overlay").classList.remove("show");
      state.editingJob = null;
    }

    function collectForm(){
      const jobName = document.getElementById("jobName").value.trim();
      const type = document.getElementById("jobType").value.trim();
      const startDate = document.getElementById("startDate").value;
      const strikeDate = document.getElementById("strikeDate").value;
      const address = document.getElementById("jobAddress").value.trim();
      const notes = document.getElementById("jobNotes").value.trim();
      const employees = Array.from(document.querySelectorAll('#employeeToggles input[type="checkbox"]:checked')).map(el=>el.value);
      const inventory = Array.from(document.querySelectorAll('#inventoryWrap .inv-card')).map(card=>({
        inventory: toTitleCaseWords(card.querySelector(".inv-text").value.trim()),
        quantity: card.querySelector(".inv-qty").value.trim()
      })).filter(x=>x.inventory || x.quantity);
      return { jobName, type, startDate, strikeDate, address, notes, employees, inventory };
    }

    function validateForm(payload){
      if (!payload.jobName) return "Job Name is required.";
      if (payload.type !== "Pickup" && !payload.address) return "Address is required.";
      if (!payload.startDate) return "Start Date is required.";
      if (!payload.inventory.length) return "Add at least one inventory row.";
      return "";
    }

    async function loadEmployees(){
      const res = await jsonp(JOBS_WEBAPP_URL, { action: "getEmployees" });
      state.employees = res.employees || [];
      return state.employees;
    }

    async function loadJobs(){
      setStatus("Loading jobs…");
      const res = await jsonp(JOBS_WEBAPP_URL, { action: "listJobs" });
      state.jobs = res.jobs || [];
      renderJobs();
      setStatus("Ready");
    }

    function renderJobs(){
      const grid = document.getElementById("jobsGrid");
      const jobs = state.jobs || [];
      document.getElementById("jobCount").textContent = String(jobs.length);
      if (!jobs.length){
        grid.innerHTML = `<div class="empty">No active jobs yet. Tap the + button to create one.</div>`;
        return;
      }

      grid.innerHTML = jobs.map(job=>{
        const employees = (job.employees || []).join(", ") || "—";
        const invHtml = (job.inventory || []).map(item=>`<li class="inventory-view"><span>${item.inventory || "—"} × ${item.quantity || "—"}</span></li>`).join("");
        return `
          <div class="job-card" data-job-id="${job.jobId}">
            <div class="job-card-header">
              <h2>${job.jobName || "Untitled Job"}</h2>
              <span class="job-chip">${job.type || "—"}</span>
            </div>
            <div class="job-meta">
              <div class="job-meta-row"><strong>Dates:</strong> ${formatJobDate(job.startDate, job.strikeDate)}</div>
              <div class="job-meta-row"><strong>Address:</strong> ${job.address || "—"}</div>
              <div class="job-meta-row"><strong>Employees:</strong> ${employees}</div>\n              <div class="job-meta-row"><strong>Notes:</strong> ${job.notes || "—"}</div>\n              <div class="job-meta-row"><strong>Job ID:</strong> ${job.jobId || "—"}</div>
            </div>
            <ul class="inventory-list">${invHtml}</ul>
          </div>
        `;
      }).join("");

      grid.querySelectorAll(".job-card").forEach(card=>{
        card.addEventListener("click", ()=>{
          const job = jobs.find(j=>j.jobId === card.dataset.jobId);
          if (job) openSheet(job);
        });
      });
    }

    async function saveJob(evt){
      evt.preventDefault();
      const payload = collectForm();
      const err = validateForm(payload);
      if (err) return setFormMsg(err, true);

      document.getElementById("saveBtn").disabled = true;
      setFormMsg("Saving…", false);

      try{
        await jsonp(JOBS_WEBAPP_URL, {
          action: "saveJob",
          baseJobId: state.editingJob ? state.editingJob.baseJobId : "",
          payload: JSON.stringify(payload)
        }, 20000);
        setFormMsg("Saved.", false);
        await loadJobs();
        closeSheet();
      }catch(e){
        setFormMsg(String(e.message || e), true);
      }finally{
        document.getElementById("saveBtn").disabled = false;
      }
    }

    async function deleteJob(){
      if (!state.editingJob) return;
      if (!confirm("Delete this entire job?")) return;

      const btn = document.getElementById("deleteJobBtn");
      btn.disabled = true;
      setFormMsg("Deleting…", false);

      try{
        await jsonp(JOBS_WEBAPP_URL, {
          action: "deleteJob",
          baseJobId: state.editingJob.baseJobId
        }, 20000);
        await loadJobs();
        closeSheet();
      }catch(e){
        setFormMsg(String(e.message || e), true);
      }finally{
        btn.disabled = false;
      }
    }

    document.getElementById("newJobBtn").addEventListener("click", ()=>openSheet(null));
    document.getElementById("refreshBtn").addEventListener("click", loadJobs);
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    document.getElementById("cancelBtn").addEventListener("click", closeSheet);
    document.getElementById("overlay").addEventListener("click", closeSheet);
    document.getElementById("addInventoryBtn").addEventListener("click", ()=>ensureInventoryRow());
    document.getElementById("jobForm").addEventListener("submit", saveJob);
    document.getElementById("deleteJobBtn").addEventListener("click", deleteJob);
    ["jobName","jobAddress","jobNotes"].forEach(id=>document.getElementById(id).addEventListener("input", e=>autoGrow(e.target)));
    document.getElementById("jobType").addEventListener("change", syncTypeVisibility);

    (async function init(){
      try{
        await loadEmployees();
        await loadJobs();
      }catch(e){
        setStatus(String(e.message || e));
        document.getElementById("jobsGrid").innerHTML = `<div class="empty">Failed to load jobs. Check the Apps Script /exec URL and deployment access.</div>`;
      }
    })();
  </script>
</body>
</html>
