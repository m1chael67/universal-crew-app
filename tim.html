<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="logo_resized.png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tim's Jobs - Universal Rentals</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    .job-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .job-block h2 {
      margin: 0;
    }
    .copy-address {
      cursor: pointer;
    }
    .copy-address:hover {
      background-color: #f4f4f4;
    }
    .copy-popup {
      position: absolute;
      transform: translateX(-50%);
      padding: 4px 8px;
      background: #333;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 2000;
    }
  </style>
</head>
<body>
  <div class="top-bar" style="position: fixed; top: 0; right: 0; padding: 0.5rem; font-size: 12px; background: white; z-index: 1000;">
    Hours this month: <span id="hour-counter">0</span>
  </div>

  <div class="container" style="margin-top: 2rem;">
    <h1>Tim's Jobs</h1>
    <div id="job-list">Loading...</div>
  </div>

  <script>
    // Hours counter - leave logic as-is for now
    const now = new Date();
    const hoursKey = "hours-" + now.getFullYear() + "-" + (now.getMonth() + 1);
    const hours = localStorage.getItem(hoursKey) || "0";
    document.getElementById("hour-counter").textContent = hours;

    // Which employee this page is for; null means show all jobs
    const FILTER_EMPLOYEE = "Tim";

    const sheetId = "1EXRZrzTEGMCG2ceIKg7ZkAZHPOMZojz7n00hAs2a5FA";
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows || [];
        const data = rows.map(r => r.c.map(c => c ? c.v : ""));

        const jobsByNameDate = {};

        data.forEach(row => {
          const [Name, Address, Phone, DateStr, Item, Quantity, Type, Note, AllCol, MichaelCol, TimCol, JoeCol, JeffCol] = row;
          if (!Name || !DateStr) return;

          // Decide if this row belongs on this page
          const hasAll = !!AllCol;
          const assignedEmployees = [];
          if (MichaelCol) assignedEmployees.push("Michael");
          if (TimCol) assignedEmployees.push("Tim");
          if (JoeCol) assignedEmployees.push("Joe");
          if (JeffCol) assignedEmployees.push("Jeff");

          let includeForThisPage = true;
          if (FILTER_EMPLOYEE) {
            // Only include if All is checked OR this employee's column is checked
            if (!hasAll) {
              if (FILTER_EMPLOYEE === "Tim" && !TimCol) includeForThisPage = false;
              if (FILTER_EMPLOYEE === "Joe" && !JoeCol) includeForThisPage = false;
              if (FILTER_EMPLOYEE === "Jeff" && !JeffCol) includeForThisPage = false;
              if (FILTER_EMPLOYEE === "Michael" && !MichaelCol) includeForThisPage = false;
            }
          }
          if (!includeForThisPage) return;

          // Parse date
          let dateKey = DateStr;
          let dateObj = null;

          if (dateKey instanceof Date) {
            dateObj = dateKey;
            const weekday = dateKey.toLocaleDateString("en-US", { weekday: "long" });
            const mm = String(dateKey.getMonth() + 1).padStart(2, "0");
            const dd = String(dateKey.getDate()).padStart(2, "0");
            const yyyy = dateKey.getFullYear();
            dateKey = `${weekday} - ${mm}/${dd}/${yyyy}`;
          } else if (typeof dateKey === "string") {
            const match = dateKey.match(/^Date\((\d+),\s*(\d+),\s*(\d+)\)$/);
            if (match) {
              const yyyy = parseInt(match[1], 10);
              const mm = parseInt(match[2], 10); // 0-based month from Sheets
              const dd = parseInt(match[3], 10);

              const jsDate = new Date(yyyy, mm, dd);
              dateObj = jsDate;

              const weekday = jsDate.toLocaleDateString("en-US", { weekday: "long" });
              const mmStr = String(mm + 1).padStart(2, "0");
              const ddStr = String(dd).padStart(2, "0");

              dateKey = `${weekday} - ${mmStr}/${ddStr}/${yyyy}`;
            } else {
              // Fallback: just use the raw string
              dateKey = String(dateKey);
            }
          } else {
            dateKey = String(dateKey);
          }

          const groupKey = Name + "|" + dateKey;

          if (!jobsByNameDate[groupKey]) {
            jobsByNameDate[groupKey] = {
              Name,
              Date: dateKey,
              dateObj,
              Type,
              Address,
              Phone,
              inventory: [],
              employees: assignedEmployees
            };
          }

          jobsByNameDate[groupKey].inventory.push({ Item, Quantity, Note });
        });

        const list = document.getElementById("job-list");
        list.innerHTML = "";

        let jobsArray = Object.values(jobsByNameDate);

        if (!jobsArray.length) {
          list.textContent = "No jobs found.";
          return;
        }

        // Sort by date ascending
        jobsArray.sort((a, b) => {
          if (a.dateObj && b.dateObj) return a.dateObj - b.dateObj;
          if (a.dateObj) return -1;
          if (b.dateObj) return 1;
          return a.Name.localeCompare(b.Name);
        });

        jobsArray.forEach(job => {
          const block = document.createElement("div");
          block.className = "job-block";

          // Color-code left border by Type
          const typeText = (job.Type || "").toLowerCase();
          let borderColor = "#007bff"; // default blue
          if (typeText.includes("setup") || typeText.includes("set-up") || typeText.includes("set up")) {
            borderColor = "#28a745"; // green
          } else if (typeText.includes("strike")) {
            borderColor = "#dc3545"; // red
          } else if (typeText.includes("pickup") || typeText.includes("pick-up") || typeText.includes("pick up")) {
            borderColor = "#007bff"; // blue for pickup
          }
          block.style.borderLeft = "5px solid " + borderColor;

          const crewLabel = job.employees && job.employees.length
            ? `<p><strong>Crew:</strong> ${job.employees.join(", ")}</p>`
            : "";

          block.innerHTML = `
            <div class="job-block-header">
              <h2>${job.Name}</h2>
              <span style="font-weight: bold;">${job.Date}</span>
            </div>
            <p><strong>Type:</strong> ${job.Type || ""}</p>
            ${crewLabel}
            <p class="copy-address" data-address="${job.Address || ""}">
              <strong>Address:</strong> ${job.Address || ""}
            </p>
            <p><strong>Phone:</strong> <a href="tel:${job.Phone || ""}">${job.Phone || ""}</a></p>
            <h3>Inventory</h3>
            <ul>
              ${job.inventory.map(i => `
                <li>
                  ${i.Item || ""} × <span style="color: green;">${i.Quantity || ""}</span>
                  ${i.Note ? `<span style="color: red; margin-left: 8px;">${i.Note}</span>` : ""}
                </li>
              `).join("")}
            </ul>
          `;
          list.appendChild(block);
        });
      })
      .catch(err => {
        document.getElementById("job-list").textContent = "Failed to load jobs.";
        console.error(err);
      });

    // Click-to-copy address with "Copied!" popup
    document.addEventListener("click", function (e) {
      const target = e.target.closest(".copy-address");
      if (!target) return;

      const text = target.dataset.address || target.textContent.replace("Address:", "").trim();

      function showPopup() {
        const rect = target.getBoundingClientRect();
        const popup = document.createElement("div");
        popup.textContent = "Copied!";
        popup.className = "copy-popup";

        document.body.appendChild(popup);

        popup.style.left = window.scrollX + rect.left + rect.width / 2 + "px";
        popup.style.top = window.scrollY + rect.top - 30 + "px";

        setTimeout(() => {
          popup.remove();
        }, 800);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showPopup).catch(showPopup);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
        } catch (err) {}
        document.body.removeChild(textarea);
        showPopup();
      }
    });
  </script>
</body>
</html>
