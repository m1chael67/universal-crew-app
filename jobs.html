<!DOCTYPE html>

<html lang="en">
<head>
<link rel="apple-touch-icon" href="logo_resized.png" />
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Jobs - Universal Rentals</title>
<link href="style.css" rel="stylesheet"/>
<link href="favicon.png" rel="icon" type="image/png"/>
<style>
    .job-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .job-block h2 {
      margin: 0;
    }
  
.bullet-flex { display: flex; justify-content: space-between; list-style-type: disc; list-style-position: inside; }

.copy-address {
  cursor: pointer;
}

.copy-address:hover {
  background-color: #f4f4f4;
}

.copy-popup {
  position: absolute;
  transform: translateX(-50%);
  padding: 4px 8px;
  background: #333;
  color: #fff;
  border-radius: 4px;
  font-size: 12px;
  pointer-events: none;
  z-index: 2000;
}
</style>
</head>
<body>
<div class="top-bar" style="position: fixed; top: 0; right: 0; padding: 0.5rem; font-size: 12px; background: white; z-index: 1000;">
    Hours this month: <span id="hour-counter">0</span>
</div>
<div class="container" style="margin-top: 2rem;">
<h1>All Jobs</h1>
<div id="job-list">Loading...</div>
</div>
<script>
    const now = new Date();
    const key = `hours-${now.getFullYear()}-${now.getMonth() + 1}-${localStorage.getItem("employee") || "unknown"}`;
    const hours = parseFloat(localStorage.getItem(key)) || 0;
    document.getElementById("hour-counter").innerText = hours.toFixed(2);
  </script>
<script>
    const SHEET_ID = "1EXRZrzTEGMCG2ceIKg7ZkAZHPOMZojz7n00hAs2a5FA";
    const API_KEY = "AIzaSyCUzbQn2WrLURFvuJHOIirxf9_PhpC81jY";
    const RANGE = "Sheet1!A2:H";

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(
      RANGE
    )}?key=${API_KEY}`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (!data.values) {
          document.getElementById("job-list").textContent = "No jobs found.";
          return;
        }

        const rows = data.values;

        const jobsByNameDate = {};

        rows.forEach(row => {
          const [Name, Address, Phone, DateStr, Item, Quantity, Type, Note] = row;
          if (!Name || !DateStr) return;

		  let dateKey = DateStr;

		  // If it's an actual Date object from the API
		  if (dateKey instanceof Date) {
		    const options = { weekday: "long" };
		    const weekday = dateKey.toLocaleDateString("en-US", options);

		    const mm = String(dateKey.getMonth() + 1).padStart(2, "0");
		    const dd = String(dateKey.getDate()).padStart(2, "0");
		    const yyyy = dateKey.getFullYear();

		    dateKey = `${weekday} - ${mm}/${dd}/${yyyy}`;
		  }
		  // If it's a string like "Date(2025,11,21)"
		  else if (typeof dateKey === "string") {
		    const match = dateKey.match(/^Date\((\d+),\s*(\d+),\s*(\d+)\)$/);
		    if (match) {
		      const yyyy = parseInt(match[1], 10);
		      const mm = parseInt(match[2], 10);
		      const dd = parseInt(match[3], 10);

		      const jsDate = new Date(yyyy, mm - 1, dd);

		      const options = { weekday: "long" };
		      const weekday = jsDate.toLocaleDateString("en-US", options);

		      const mmStr = String(mm).padStart(2, "0");
		      const ddStr = String(dd).padStart(2, "0");

		      dateKey = `${weekday} - ${mmStr}/${ddStr}/${yyyy}`;
		    }
		  }
          
          const key = Name + dateKey;

          if (!jobsByNameDate[key]) {
            jobsByNameDate[key] = {
              Name, Date: dateKey, Type, Address, Phone,
              inventory: []
            };
          }
          jobsByNameDate[key].inventory.push({ Item, Quantity, Note });
        });

        const list = document.getElementById("job-list");
        list.innerHTML = "";

        Object.values(jobsByNameDate).forEach(job => {
          const block = document.createElement("div");
          block.className = "job-block";

          block.innerHTML = `
            <div class="job-block-header">
              <h2>${job.Name}</h2>
              <span style="font-weight: bold;">${job.Date}</span>
            </div>
            <p><strong>Type:</strong> ${job.Type}</p>
            <p class="copy-address" data-address="${job.Address}"><strong>Address:</strong> ${job.Address}</p>
            <p><strong>Phone:</strong> <a href="tel:${job.Phone}">${job.Phone}</a></p>
            <h3>Inventory</h3>
            <ul>
              ${job.inventory.map(i =>
                `<li style="display: flex; justify-content: space-between; list-style-type: disc; list-style-position: inside;">
                  <span>${i.Item} × ${i.Quantity}</span>
                  ${i.Note ? `<span style="color: red; margin-left: 8px;">${i.Note}</span>` : ""}
                </li>`
              ).join("")}
            </ul>
          `;
          list.appendChild(block);
        });
      })
      .catch(err => {
        document.getElementById("job-list").textContent = "Failed to load jobs.";
        console.error(err);
      });

      // Click-to-copy address with small "Copied!" popup
      document.addEventListener("click", function (e) {
        const target = e.target.closest(".copy-address");
        if (!target) return;

        const text = target.dataset.address || target.textContent.replace("Address:", "").trim();

        function showPopup() {
          const rect = target.getBoundingClientRect();
          const popup = document.createElement("div");
          popup.textContent = "Copied!";
          popup.className = "copy-popup";

          document.body.appendChild(popup);

          popup.style.left = (window.scrollX + rect.left + rect.width / 2) + "px";
          popup.style.top = (window.scrollY + rect.top - 30) + "px";

          setTimeout(() => {
            popup.remove();
          }, 800);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showPopup).catch(showPopup);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          try { document.execCommand("copy"); } catch (err) {}
          document.body.removeChild(textarea);
          showPopup();
        }
      });
  </script>
</body>
</html>
