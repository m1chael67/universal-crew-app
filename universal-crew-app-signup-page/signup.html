<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link rel="stylesheet" href="style.css">

<style>

	.login-btn{
	  position: fixed;
	  top: 20px;
	  left: 20px;
	  background:#333;
	  color:white;
	  padding:8px 14px;
	  border-radius:6px;
	  text-decoration:none;
	  font-weight:bold;
	  z-index:1000;
	}

	.login-btn:hover{
	  background:#000;
	}

.topbar{
  display:flex;
  align-items:center;
  padding:10px 15px;
}

.login-btn{
  background:#333;
  color:white;
  padding:8px 14px;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}

.login-btn:hover{
  background:#000;
}

.signup-card{
  width: 420px;
  padding: 30px;
  background:white;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.signup-card h1{
  text-align:center;
  margin-bottom:25px;
}

.signup-card input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:16px;
}

.signup-card button{
  width:100%;
  padding:12px;
  background:#2b7cff;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.signup-card button:hover{
  background:#1a5fe0;
}

</style>
</head>

<body>

<div class="topbar">
<a class="login-btn" href="../index.html">Login</a>
</div>

<div class="signup-card">

<h1>Create Account</h1>

<form id="signup-form" onsubmit="return handleSignup(event)">

<input type="text" id="name" placeholder="Your Name" required>

<input type="password" id="pin1" placeholder="Enter 4 Digit PIN" maxlength="4" required>

<input type="password" id="pin2" placeholder="Confirm PIN" maxlength="4" required>

<button type="submit">Create Account</button>

</form>

</div>

<script>

let existingPins = null;

function fetchExistingPins() {
fetch("https://m1chael67.github.io/universal-crew-app/index.html")
.then(function(res) { return res.text(); })
.then(function(html) {
var match = html.match(/const\s+EMPLOYEES\s*=\s*({[\s\S]*?});/);
if (!match) {
console.warn("EMPLOYEES definition not found on index page.");
return;
}

try {
var objLiteral = match[1];
var fn = new Function('"use strict"; return (' + objLiteral + ');');
var employees = fn();
existingPins = Object.keys(employees);
} catch (e) {
console.error("Failed to parse EMPLOYEES from index.html", e);
}
})
.catch(function(err) {
console.error("Failed to fetch index.html for PIN check", err);
});
}

document.addEventListener("DOMContentLoaded", fetchExistingPins);

function handleSignup(e) {
e.preventDefault();

const name = document.getElementById('name').value;
const pin1 = document.getElementById('pin1').value;
const pin2 = document.getElementById('pin2').value;

if (pin1 !== pin2) {
alert("PINs do not match.");
return false;
}

if (existingPins && existingPins.indexOf(pin1) !== -1) {
alert("That PIN is already in use.");
return false;
}

const form = document.createElement('form');
form.action = "https://formsubmit.co/michaellazarov12@gmail.com";
form.method = "POST";
form.style.display = "none";

const n = document.createElement('input');
n.type = "hidden";
n.name = "New Employee Name";
n.value = name;

const p = document.createElement('input');
p.type = "hidden";
p.name = "Requested PIN";
p.value = pin1;

const redirect = document.createElement('input');
redirect.type = "hidden";
redirect.name = "_next";
redirect.value = "https://m1chael67.github.io/universal-crew-app/";

form.appendChild(n);
form.appendChild(p);
form.appendChild(redirect);

document.body.appendChild(form);
form.submit();

return true;
}

</script>

</body>
</html>
