<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link rel="stylesheet" href="style.css">

<style>
html, body{
  height:100%;
}

body{
  font-family: Arial, sans-serif;
  background-color:#f4f4f4;
  margin:0;
  min-height:100vh;
  position:relative;
}

.login-btn{
  position:fixed;
  top:20px;
  left:20px;
  background:#333;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  z-index:1000;
  box-shadow:0 4px 10px rgba(0,0,0,0.12);
}

.login-btn:hover{
  background:#000;
}

.page-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.signup-card{
  width:min(420px, calc(100vw - 48px));
  padding:30px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.signup-card h1{
  text-align:center;
  margin:0 0 25px 0;
}

.signup-card input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:16px;
  box-sizing:border-box;
}

.signup-card button{
  width:100%;
  padding:12px;
  background:#2b7cff;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.signup-card button:hover{
  background:#1a5fe0;
}

.signup-card button:disabled{
  background:#6b7280;
  cursor:not-allowed;
}

.signup-message{
  display:none;
  margin-top:12px;
  text-align:center;
  font-weight:bold;
  color:#444;
  line-height:1.35;
}

</style>
</head>

<body>

<a class="login-btn" href="../index.html">Login</a>

<div class="page-wrap">
  <div class="signup-card">
    <h1>Create Account</h1>

    <form id="signup-form" onsubmit="return handleSignup(event)">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="password" id="pin1" placeholder="Enter 4 Digit PIN" maxlength="4" required>
      <input type="password" id="pin2" placeholder="Confirm PIN" maxlength="4" required>
      <button type="submit">Create Account</button>
    </form>
    <div id="signup-message" class="signup-message">
      Please allow the system up to 1 day to create your account before logging in.
    </div>
  </div>
</div>

<script>
let existingPins = null;
const SIGNUP_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxw8snuctfO2oL6wvFKUM8ReNOqj4S_k9I7NDzb6tqjUWfpVhbOtbVD5bLMlKe7KDOV/exec";

function fetchExistingPins() {
fetch("https://m1chael67.github.io/universal-crew-app/index.html")
.then(function(res) { return res.text(); })
.then(function(html) {
var match = html.match(/const\s+EMPLOYEES\s*=\s*({[\s\S]*?});/);
if (!match) {
console.warn("EMPLOYEES definition not found on index page.");
return;
}

try {
var objLiteral = match[1];
var fn = new Function('"use strict"; return (' + objLiteral + ');');
var employees = fn();
existingPins = Object.keys(employees);
} catch (e) {
console.error("Failed to parse EMPLOYEES from index.html", e);
}
})
.catch(function(err) {
console.error("Failed to fetch index.html for PIN check", err);
});
}

document.addEventListener("DOMContentLoaded", fetchExistingPins);

function handleSignup(e) {
e.preventDefault();

const name = document.getElementById('name').value;
const pin1 = document.getElementById('pin1').value;
const pin2 = document.getElementById('pin2').value;

if (pin1 !== pin2) {
alert("PINs do not match.");
return false;
}

if (existingPins && existingPins.indexOf(pin1) !== -1) {
alert("That PIN is already in use.");
return false;
}

const btn = document.querySelector(".signup-card button");
const msg = document.getElementById("signup-message");

btn.disabled = true;
btn.textContent = "Submitted";
if (msg) msg.style.display = "block";

fetch(SIGNUP_WEB_APP_URL, {
  method: "POST",
  mode: "no-cors",
  headers: {
    "Content-Type": "application/x-www-form-urlencoded"
  },
  body: new URLSearchParams({
    name: name.trim(),
    pin: pin1.trim(),
    date: new Date().toISOString(),
    source: "signup_page"
  })
}).catch(function(err) {
  console.error("Signup submission failed", err);
});

// Clear fields after sending
document.getElementById("name").value = "";
document.getElementById("pin1").value = "";
document.getElementById("pin2").value = "";

return false;
}
</script>

</body>
</html>
