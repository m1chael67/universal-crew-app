<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tent Entry</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f3f3f3;color:#111;}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px;}
  h1{margin:10px 0 16px;font-size:40px;text-align:center;}
  .card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  label{font-weight:800;color:#444;min-width:92px;}
  select,input{padding:12px 12px;border-radius:12px;border:1px solid #ddd;background:#fff;min-width:200px;}
  input[type="text"]{flex:1;min-width:220px;}
  .btn{border:0;background:#111;color:#fff;border-radius:18px;padding:14px 18px;font-weight:900;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.12);}
  .btn.secondary{background:#fff;color:#111;border:1px solid #ddd;box-shadow:none;padding:10px 14px;border-radius:14px;}
  .muted{color:#666;}
  .err{color:#b00020;font-weight:800;}
  .ok{color:#1b5e20;font-weight:800;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Tent Form</h1>
    <div class="card">
      <button class="btn secondary" id="backBtn">← Back</button>
      <p class="muted" style="margin:10px 0 16px;">Update a tent’s status. “On job” requires a job name.</p>

      <div class="row">
        <label for="action">Action</label>
        <select id="action">
          <option value="on job">On job</option>
          <option value="return">Return</option>
          <option value="washed">Washed</option>
          <option value="needs wash">Needs wash</option>
        </select>
      </div>

      <div class="row">
        <label for="tent">Tent</label>
        <select id="tent"></select>
      </div>

      <div class="row">
        <label for="number">Number</label>
        <select id="number"></select>
      </div>

      <div class="row" id="jobRow" style="display:none;">
        <label for="job">Job</label>
        <input id="job" type="text" placeholder="e.g., Smith wedding, 123 Main St" />
      </div>

      <div class="row">
        <button class="btn" id="submitBtn">Submit</button>
      </div>

      <div id="msg" class="muted"></div>
    </div>
  </div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybc-xp3x29hukpnE0Be1jqV8mh0I96HWIarNFkJo2INq0RI3vhMDrDVpI_Va7TYBCC/exec";

document.getElementById("backBtn").addEventListener("click", ()=>history.back());

function jsonp(url, params, timeoutMs=8000){
  return new Promise((resolve, reject)=>{
    const cbName = "__cb_" + Math.random().toString(36).slice(2);
    const u = new URL(url);
    Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k, v));
    u.searchParams.set("callback", cbName);

    let done = false;
    const t = setTimeout(()=>{
      if(done) return;
      done = true;
      cleanup();
      reject(new Error("Web app did not respond (timeout)."));
    }, timeoutMs);

    function cleanup(){
      clearTimeout(t);
      delete window[cbName];
      script.remove();
    }

    window[cbName] = (data)=>{
      if(done) return;
      done = true;
      cleanup();
      resolve(data);
    };

    const script = document.createElement("script");
    script.src = u.toString();
    script.onerror = ()=>{
      if(done) return;
      done = true;
      cleanup();
      reject(new Error("Failed to load web app script."));
    };
    document.head.appendChild(script);
  });
}

const elAction = document.getElementById("action");
const elTent = document.getElementById("tent");
const elNumber = document.getElementById("number");
const jobRow = document.getElementById("jobRow");
const elJob = document.getElementById("job");
const msg = document.getElementById("msg");

let catalog = [];

function setOptions(selectEl, values){
  selectEl.innerHTML="";
  (values||[]).forEach(v=>{
    const o=document.createElement("option");
    o.value=v; o.textContent=v;
    selectEl.appendChild(o);
  });
}

function syncNumbers(){
  const t = elTent.value;
  const nums = catalog.filter(x=>x.tent===t).map(x=>String(x.number));
  setOptions(elNumber, nums);
}

elAction.addEventListener("change", ()=>{
  jobRow.style.display = (elAction.value === "on job") ? "flex" : "none";
});

elTent.addEventListener("change", syncNumbers);

async function boot(){
  try{
    msg.textContent = "Loading…";
    const meta = await jsonp(WEB_APP_URL, { action:"meta" });
    if(!meta || meta.ok !== true) throw new Error(meta && meta.error ? meta.error : "Meta load failed");
    catalog = meta.catalog || [];
    const tentTypes = meta.tentTypes || [];
    if(!tentTypes.length) throw new Error("No tents found in the Tents sheet.");
    setOptions(elTent, tentTypes);
    syncNumbers();
    msg.textContent = "";
  } catch(e){
    console.error(e);
    msg.innerHTML = `<span class="err">${e.message}</span>`;
  }
}

document.getElementById("submitBtn").addEventListener("click", async ()=>{
  try{
    msg.textContent = "";
    const action = elAction.value;
    const tent = elTent.value;
    const number = elNumber.value;
    const job = (action === "on job") ? (elJob.value || "").trim() : "";

    if(action === "on job" && !job){
      msg.innerHTML = '<span class="err">Job is required for "On job".</span>';
      return;
    }

    msg.textContent = "Submitting…";
    const res = await jsonp(WEB_APP_URL, {
      action: "submit",
      entryAction: action,
      tent: tent,
      number: number,
      job: job
    });

    if(!res || res.ok !== true) throw new Error(res && res.error ? res.error : "Submit failed");
    msg.innerHTML = '<span class="ok">Saved.</span>';
    setTimeout(()=>history.back(), 400);
  } catch(e){
    console.error(e);
    msg.innerHTML = `<span class="err">${e.message}</span>`;
  }
});

boot();
</script>
</body>
</html>
