<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tent Form</title>
  <style>
    :root{
      --bg:#f3f3f3;
      --card:#ffffff;
      --text:#111;
      --muted:#666;
      --shadow:0 10px 24px rgba(0,0,0,.08);
      --radius:18px;
      --pill-radius:999px;
      --btn:#0f0f10;
      --btnText:#fff;
      --bad:#b00020;
      --line:#e7e7e7;
    }
    *,*::before,*::after{box-sizing:border-box;}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:18px 10px 28px;
    }
    h1{
      text-align:center;
      font-size:56px;
      margin:10px 0 18px;
      letter-spacing:-1px;
    }
    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px 18px 20px;
      max-width:740px;
      margin:0 auto;
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 18px;
      border-radius:18px;
      border:1px solid var(--line);
      background:#f7f7f7;
      cursor:pointer;
      font-weight:900;
      font-size:18px;
    }
    .hint{
      margin:14px 0 10px;
      color:var(--muted);
      font-size:18px;
      line-height:1.25;
    }
    .row{
  display:grid;
  grid-template-columns:120px minmax(0,1fr);
  gap:14px;
  align-items:center;
  margin:16px 0;
}
.row label{
  font-size:24px;
  font-weight:900;
  letter-spacing:-0.2px;
}
select,input{
  width:100%;
  max-width:100%;
  min-width:0;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid var(--line);
  font-size:18px;
  outline:none;
  background:#fff;
}
    .btn{
      appearance:none;
      border:none;
      background:var(--btn);
      color:var(--btnText);
      padding:18px 28px;
      border-radius:var(--pill-radius);
      font-weight:900;
      font-size:22px;
      box-shadow:0 10px 18px rgba(0,0,0,.14);
      cursor:pointer;
    }
    .submitWrap{display:flex;justify-content:center;margin-top:10px;}
    .submitWrap .btn{min-width:190px;}

    .msg{
      margin-top:16px;
      font-size:26px;
      font-weight:900;
      color:var(--bad);
      text-align:center;
    }
    .disabled{opacity:.6;cursor:not-allowed;}
  
        @media (max-width: 480px){
      body{ padding:16px 10px 24px; }
      h1{ font-size:44px; margin:6px 0 14px; }
      .card{ border-radius:16px; padding:16px 14px 18px; box-shadow:0 8px 18px rgba(0,0,0,.08); }
      .back{ font-size:16px; padding:10px 14px; border-radius:14px; }
      .hint{ font-size:15px; line-height:1.25; }

      .row{
        grid-template-columns: 1fr;
        gap:10px;
        margin:14px 0;
      }
      .row label{ font-size:16px; }
      select,input{ font-size:15px; padding:10px 10px; border-radius:12px; }

      .submitWrap{ margin-top:12px; }
      .submitWrap .btn{
        width:100%;
        max-width:340px;
        font-size:16px;
        padding:12px 16px;
        box-shadow:0 8px 14px rgba(0,0,0,.12);
      }
    }
</style>
</head>
<body>
  <h1>Tent Form</h1>
  <div class="card">
    <button class="back" id="backBtn">← Back</button>

    <div class="hint">
      Update a tent’s status. “On job” requires a job name. “Needs Repair” requires a repair note.
    </div>

    <div class="row">
      <label for="actionSel">Action</label>
      <select id="actionSel">
        <option>On job</option>
        <option>Return</option>
        <option>Washed</option>
        <option>Needs Wash</option>
        <option>Needs Repair</option>
        <option>Repaired</option>
      </select>
    </div>

    <div class="row" id="jobRow" style="display:none;">
      <label for="jobInput">Job</label>
      <input id="jobInput" placeholder="Which job is it on?" />
    </div>

    <div class="row" id="repairRow" style="display:none;">
      <label for="repairInput">Repair Note</label>
      <input id="repairInput" placeholder="What needs repair?" />
    </div>

    <div class="row">
      <label for="tentSel">Tent</label>
      <select id="tentSel"></select>
    </div>

    <div class="row">
      <label for="numSel">Number</label>
      <select id="numSel"></select>
    </div>

    <div class="submitWrap"><button class="btn" id="submitBtn">Submit</button></div>
    <div class="msg" id="msg" style="display:none;"></div>
  </div>

  <script>
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxN03Zbnzq-WPETPVick-dPBwbtK4SfBlWDl1k4ykH98DbgMYW79JOSmexF9khGXWo/exec";

  function getQuery(){
    const out = {};
    const qs = new URLSearchParams(location.search);
    for (const [k,v] of qs.entries()) out[k]=v;
    return out;
  }
  const Q = getQuery();
  function withQuery(url){
    const qs = new URLSearchParams(Q).toString();
    if (!qs) return url;
    return url + (url.includes("?") ? "&" : "?") + qs;
  }

  function jsonp(url, params, timeoutMs=12000){
    return new Promise((resolve, reject)=>{
      const cbName = "cb_" + Math.random().toString(16).slice(2);
      const u = new URL(url);
      Object.keys(params||{}).forEach(k=>u.searchParams.set(k, params[k]));
      u.searchParams.set("callback", cbName);

      let done = false;
      const script = document.createElement("script");
      const timer = setTimeout(()=>{
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("Web app did not respond (timeout). Make sure the /exec URL is correct and returns JSONP."));
      }, timeoutMs);

      function cleanup(){
        clearTimeout(timer);
        script.remove();
        try{ delete window[cbName]; }catch(_){}
      }

      window[cbName] = (data)=>{
        if (done) return;
        done = true;
        cleanup();
        if (data && data.ok === false && data.error) reject(new Error(String(data.error)));
        else resolve(data);
      };

      script.onerror = ()=>{
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("JSONP request failed. Check Apps Script deployment access."));
      };

      script.src = u.toString();
      document.body.appendChild(script);
    });
  }

  function toStr(v){ return (v===null||v===undefined) ? "" : String(v); }
  function setMsg(text, isError=true){
    const el = document.getElementById("msg");
    el.style.display = "block";
    el.style.color = isError ? "#b00020" : "#1f8a3b";
    el.textContent = text;
  }

  const actionSel = document.getElementById("actionSel");
  const jobRow = document.getElementById("jobRow");
  const jobInput = document.getElementById("jobInput");
  const repairRow = document.getElementById("repairRow");
  const repairInput = document.getElementById("repairInput");
  const tentSel = document.getElementById("tentSel");
  const numSel = document.getElementById("numSel");
  const submitBtn = document.getElementById("submitBtn");

  let tentsRows = [];

  function updateJobVisibility(){
    const a = toStr(actionSel.value).toLowerCase();
    jobRow.style.display = (a === "on job") ? "grid" : "none";
    repairRow.style.display = (a === "needs repair") ? "grid" : "none";
  }

  function fillTents(){
    const tents = Array.from(new Set(tentsRows.map(r=>toStr(r.Tent).trim()).filter(Boolean)))
      .sort((a,b)=>a.localeCompare(b, undefined, {numeric:true,sensitivity:"base"}));

    tentSel.innerHTML = "";
    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = "Select…";
    tentSel.appendChild(ph);

    tents.forEach(t=>{
      const o = document.createElement("option");
      o.value = t;
      o.textContent = t;
      tentSel.appendChild(o);
    });
  }

  function fillNumbers(){
    const chosenTent = toStr(tentSel.value).trim();
    numSel.innerHTML = "";
    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = "Select…";
    numSel.appendChild(ph);

    if (!chosenTent) return;

    const nums = Array.from(new Set(
      tentsRows
        .filter(r=>toStr(r.Tent).trim() === chosenTent)
        .map(r=>toStr(r.Number).trim())
        .filter(Boolean)
    )).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true,sensitivity:"base"}));

    nums.forEach(n=>{
      const o = document.createElement("option");
      o.value = n;
      o.textContent = n;
      numSel.appendChild(o);
    });
  }

  async function init(){
    document.getElementById("backBtn").addEventListener("click", ()=>{
      history.back(); // force real browser back (no query logic)
    });

    actionSel.addEventListener("change", updateJobVisibility);
    tentSel.addEventListener("change", fillNumbers);
    updateJobVisibility();

    try{
      const res = await jsonp(WEBAPP_URL, { action:"tents" });
      tentsRows = (res && res.tents) ? res.tents : [];
      fillTents();
      fillNumbers();
      if (!tentsRows.length){
        setMsg("No tents found in the Tents sheet.", true);
      }
    }catch(e){
      setMsg(String(e.message||e), true);
    }

    submitBtn.addEventListener("click", async ()=>{
      document.getElementById("msg").style.display = "none";

      const action = toStr(actionSel.value).trim();
      const tent = toStr(tentSel.value).trim();
      const number = toStr(numSel.value).trim();
      const job = toStr(jobInput.value).trim();
      const repairNote = toStr(repairInput.value).trim();

      if (!action) return setMsg("Pick an action.", true);
      if (!tent) return setMsg("Pick a tent.", true);
      if (!number) return setMsg("Pick a number.", true);
      if (action.toLowerCase()==="on job" && !job) return setMsg("On job requires a job name.", true);
      if (action.toLowerCase()==="needs repair" && !repairNote) return setMsg("Needs Repair requires a repair note.", true);

      // Prevent spamming: disable until request finishes
      submitBtn.disabled = true;
      submitBtn.classList.add("disabled");

      try{
        await jsonp(WEBAPP_URL, { action: "submit", actionType: action, tent: tent, number: number, job: job, repairNote: repairNote });
        setMsg("Saved.", false);

        // Tell the main page to refresh even if the browser uses back/forward cache
        localStorage.setItem("tentNeedsRefresh", "1");

        setTimeout(()=>{ history.back(); }, 400);
      }catch(e){
        setMsg("Save failed. Check Apps Script deployment + permissions.", true);
        submitBtn.disabled = false;
        submitBtn.classList.remove("disabled");
      }
    });
  }

  init();
  </script>
</body>
</html>
