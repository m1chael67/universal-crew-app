<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tents</title>
  <style>
    :root{
      --bg:#f3f3f3;
      --card:#fff;
      --text:#111;
      --muted:#666;
      --border:#e6e6e6;
      --shadow:0 10px 26px rgba(0,0,0,.10);
      --pill-shadow:0 8px 22px rgba(0,0,0,.18);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{max-width:980px;margin:0 auto;padding:18px 14px 28px;}
    h1{margin:8px 0 14px;font-size:34px;text-align:center;}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px 14px;
      position:relative;
    }
    .card-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px;}
    .card-title h2{margin:0;font-size:18px;letter-spacing:.2px;text-transform:uppercase;color:#333;}
    .small{font-size:12px;color:var(--muted);margin-top:8px;}
    .filters{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin:12px 0 14px;
    }
    @media (max-width:720px){ .filters{grid-template-columns:1fr;} }
    label{display:block;font-size:12px;color:var(--muted);font-weight:750;letter-spacing:.2px;text-transform:uppercase;margin:0 0 6px;}
    select{
      width:100%;
      font-size:16px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      outline:none;
      background:#fff;
      color:var(--text);
    }
    table{width:100%;border-collapse:separate;border-spacing:0 10px;}
    thead th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.2px;
      text-transform:uppercase;
      padding:0 10px;
    }
    tbody tr{
      background:#fafafa;
      border:1px solid var(--border);
      box-shadow:0 2px 0 rgba(0,0,0,.03);
      cursor:pointer;
    }
    tbody tr.main-row td{
      padding:12px 10px;
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
    }
    tbody tr.main-row td:first-child{
      border-left:1px solid var(--border);
      border-top-left-radius:14px;
      border-bottom-left-radius:14px;
      width:90px;
      font-variant-numeric:tabular-nums;
      font-weight:750;
    }
    tbody tr.main-row td:last-child{
      border-right:1px solid var(--border);
      border-top-right-radius:14px;
      border-bottom-right-radius:14px;
      width:160px;
    }
    .mono{font-variant-numeric:tabular-nums;}
    .badge{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:110px;
      padding:6px 10px;border-radius:999px;
      font-weight:800;font-size:12px;letter-spacing:.2px;
      border:1px solid var(--border);
    }
    .good{background:#e9f7ee;color:#167a3b;border-color:#cbeed6;}
    .bad{background:#fdecec;color:#b42318;border-color:#f6c5c5;}
    .unk{background:#f2f2f2;color:#555;border-color:#e1e1e1;}

    .details-row td{
      padding:0 10px 12px 10px;
      border-left:1px solid var(--border);
      border-right:1px solid var(--border);
      border-bottom:1px solid var(--border);
      border-bottom-left-radius:14px;
      border-bottom-right-radius:14px;
      background:#fff;
      cursor:default;
    }
    .details{
      margin-top:8px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      font-size:14px;
      color:#333;
    }
    @media (max-width:720px){ .details{grid-template-columns:1fr;} }
    .details .k{color:var(--muted);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.2px;margin-bottom:4px;}
    .details .v{font-variant-numeric:tabular-nums;}
    .actions-bar{
      display:flex;
      justify-content:center;
      margin:14px 0 0;
    }
    .btn{
      background:#111;color:#fff;border:none;border-radius:16px;
      padding:12px 20px;font-size:18px;font-weight:650;
      box-shadow:var(--pill-shadow);cursor:pointer;
    }
    .btn:active{transform:scale(.99);}

    /* Drawer (copied style from propane) */
    .hamburger-btn{
      position:fixed;top:10px;left:10px;z-index:1100;
      width:44px;height:44px;border-radius:14px;
      border:1px solid #d8d8d8;background:#f2f2f2;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;
    }
    .hamburger-lines{width:18px;height:14px;display:flex;flex-direction:column;justify-content:space-between;}
    .hamburger-lines span{display:block;height:2px;background:#111;border-radius:2px;}
    .drawer{
      position:fixed;top:0;left:0;height:100%;width:260px;
      background:#fff;border-right:1px solid #e6e6e6;
      z-index:1200;transform:translateX(-100%);
      transition:transform 220ms ease;padding:14px 12px;overflow-y:auto;
    }
    .drawer.open{transform:translateX(0);}
    .drawer h3{margin:10px 6px 12px;font-size:14px;color:#333;letter-spacing:.3px;text-transform:uppercase;}
    .drawer a{
      display:block;padding:12px 12px;border-radius:12px;
      text-decoration:none;color:#111;font-weight:650;
      border:1px solid #efefef;background:#fafafa;margin:8px 6px;
    }
    .drawer-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.22);
      z-index:1150;opacity:0;pointer-events:none;transition:opacity 220ms ease;
    }
    .drawer-overlay.open{opacity:1;pointer-events:auto;}
  </style>
</head>
<body>
  <button id="hamburger-btn" class="hamburger-btn" type="button" aria-label="Open menu">
    <div class="hamburger-lines" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </button>

  <div id="drawer" class="drawer" aria-hidden="true">
    <h3>Menu</h3>
    <a id="home-link" href="index.html">Home</a>
    <a id="propane-link" href="propane.html">Propane</a>
  </div>
  <div id="drawer-overlay" class="drawer-overlay" aria-hidden="true"></div>

  <div class="wrap">
    <h1>Tents</h1>

    <div class="card">
      <div class="card-title">
        <h2>Current</h2>
        <div class="small" id="summary">Loading…</div>
      </div>

      <div class="filters">
        <div>
          <label for="filter-tent">Tent</label>
          <select id="filter-tent">
            <option value="">All</option>
          </select>
        </div>
        <div>
          <label for="filter-grade">Grade</label>
          <select id="filter-grade">
            <option value="">All</option>
          </select>
        </div>
        <div>
          <label for="filter-avail">Action</label>
          <select id="filter-avail">
            <option value="">All</option>
            <option value="on job">On Job</option>
            <option value="return">Return</option>
            <option value="washed">Washed</option>
            <option value="needs wash">Needs Wash</option>
          </select>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tent</th>
            <th>Grade</th>
            <th>Status</th>
            <th>Reason / Job</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="small">Loading…</td></tr>
        </tbody>
      </table>

      <div class="actions-bar">
        <button id="open-entry" class="btn" type="button">Tent Form</button>
      </div>
    </div>
  </div>

<script>
  // TODO: paste your Apps Script web app URL here after you deploy it.
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxbvlbGKMCZJVKi8yFo7c_hLfOMIH-UhHkkcfX2zOevEl0OVUOtN03wxHz9p6TdWU5v/exec";

  function jsonp(url, params) {
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const qs = new URLSearchParams(params || {});
      qs.set("callback", cb);
      script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
      let done = false;

      window[cb] = (data) => {
        done = true;
        try { resolve(data); } finally {
          delete window[cb];
          script.remove();
        }
      };

      script.onerror = () => {
        if (!done) {
          delete window[cb];
          script.remove();
          reject(new Error("JSONP request failed"));
        }
      };

      document.head.appendChild(script);

      setTimeout(() => {
        if (!done) {
          delete window[cb];
          script.remove();
          reject(new Error("JSONP timeout"));
        }
      }, 15000);
    });
  }

  function toStr(v){ return (v===null||v===undefined) ? "" : String(v); }
  function fmtDate(d){
    if(!d) return "—";
    const dt = (d instanceof Date) ? d : new Date(d);
    if(isNaN(dt.getTime())) return "—";
    return dt.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
  }
  function badgeClass(av){
    if (av === "Available") return "badge good";
    if (av === "Unavailable") return "badge bad";
    return "badge unk";
  }

  let tents = [];
  let logRows = [];
  let currentRows = []; // derived

  function normalizeTentRow(r){
    return {
      Number: r.Number ?? r.number ?? r.Num ?? r.num ?? "",
      Tent: r.Tent ?? r.tent ?? "",
      Grade: r.Grade ?? r.grade ?? "",
      Notes: r.Notes ?? r.notes ?? ""
    };
  }

  function normalizeLogRow(r){
    return {
      Timestamp: r.Timestamp ?? r.timestamp ?? r.Time ?? r.time ?? "",
      Action: r.Action ?? r.action ?? "",
      Number: r.Number ?? r.number ?? "",
      Tent: r.Tent ?? r.tent ?? "",
      Availability: r.Availability ?? r.availability ?? "",
      Job: r.Job ?? r.job ?? "",
      LastWash: r["Last Wash"] ?? r.LastWash ?? r.lastWash ?? ""
    };
  }

  function sortByTentThenNumber(a,b){
    const ta = toStr(a.Tent).localeCompare(toStr(b.Tent));
    if (ta !== 0) return ta;
    const na = Number(a.Number), nb = Number(b.Number);
    if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
    return toStr(a.Number).localeCompare(toStr(b.Number));
  }

  function computeCurrent(){
    // Map latest status per tent+number
    const latest = new Map();
    const lastJob = new Map();
    const lastWash = new Map();

    logRows.forEach(r => {
      const key = toStr(r.Tent) + "||" + toStr(r.Number);
      const ts = new Date(r.Timestamp);
      const tms = isNaN(ts.getTime()) ? -Infinity : ts.getTime();

      // latest status
      if (!latest.has(key) || tms > latest.get(key)._tms){
        latest.set(key, { ...r, _tms: tms });
      }
      if (toStr(r.Action).toLowerCase() === "on job"){
        if (!lastJob.has(key) || tms > lastJob.get(key)._tms){
          lastJob.set(key, { ts: ts, _tms: tms, job: r.Job || "" });
        }
      }
      if (toStr(r.Action).toLowerCase() === "washed"){
        if (!lastWash.has(key) || tms > lastWash.get(key)._tms){
          lastWash.set(key, { ts: ts, _tms: tms });
        }
      }
    });

    currentRows = tents.map(t => {
      const key = toStr(t.Tent) + "||" + toStr(t.Number);
      const st = latest.get(key);
      let availability = "";
      let reason = "";
      let action = st ? (st.Action || "") : "";
      let job = st ? (st.Job || "") : "";

      const actLower = toStr(action).toLowerCase();
      if (st){
        availability = (actLower === "on job" || actLower === "needs wash") ? "Unavailable" : "Available";
      } else {
        availability = "Available";
      }


      if (availability === "Unavailable"){
        if (actLower === "needs wash") reason = "Needs wash";
        else if (actLower === "on job") reason = job ? ("On job: " + job) : "On job";
        else reason = action || "Unavailable";
      } else {
        reason = "";
      }

      const lj = lastJob.get(key);
      const lw = lastWash.get(key);

      return {
        ...t,
        Action: action,
        Job: job,
        Availability: availability,
        Reason: reason,
        _lastJob: lj ? lj.ts : null,
        _lastWash: lw ? lw.ts : null,
        _lastJobName: lj ? (lj.job||"") : ""
      };
    }).sort(sortByTentThenNumber);
  }

  function fillFilters(){
    const tentSel = document.getElementById("filter-tent");
    const gradeSel = document.getElementById("filter-grade");

    const tentsSet = new Set(currentRows.map(r => toStr(r.Tent)).filter(Boolean));
    const gradesSet = new Set(currentRows.map(r => toStr(r.Grade)).filter(Boolean));

    function fill(sel, vals){
      const cur = sel.value;
      sel.innerHTML = '<option value="">All</option>';
      Array.from(vals).sort((a,b)=>a.localeCompare(b)).forEach(v=>{
        const o=document.createElement("option");
        o.value=v; o.textContent=v;
        sel.appendChild(o);
      });
      sel.value = cur;
    }

    fill(tentSel, tentsSet);
    fill(gradeSel, gradesSet);
  }

  let openKey = null;

  function render(){
    const tentF = document.getElementById("filter-tent").value;
    const gradeF = document.getElementById("filter-grade").value;
    const availF = document.getElementById("filter-avail").value;

    const rows = currentRows.filter(r=>{
      if (tentF && toStr(r.Tent) !== tentF) return false;
      if (gradeF && toStr(r.Grade) !== gradeF) return false;
      if (availF && toStr(r.Action).toLowerCase() !== availF.toLowerCase()) return false;
      return true;
    });

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    if (!rows.length){
      tbody.innerHTML = '<tr><td colspan="5" class="small">No tents match your filters.</td></tr>';
      document.getElementById("summary").textContent = "0 shown";
      return;
    }

    document.getElementById("summary").textContent = `${rows.length} shown`;

    rows.forEach(r=>{
      const key = toStr(r.Tent) + "||" + toStr(r.Number);

      const tr = document.createElement("tr");
      tr.className = "main-row";
      tr.innerHTML = `
        <td class="mono">${toStr(r.Number)}</td>
        <td>${toStr(r.Tent)}</td>
        <td>${toStr(r.Grade)}</td>
        <td><span class="${badgeClass(toStr(r.Availability))}">${toStr(r.Availability)}</span></td>
        <td>${toStr(r.Reason) || "<span class='small'>—</span>"}</td>
      `;

      tr.addEventListener("click", ()=>{
        if (openKey === key){
          openKey = null;
          render();
          return;
        }
        openKey = key;
        render();
      });

      tbody.appendChild(tr);

      if (openKey === key){
        const dtr = document.createElement("tr");
        dtr.className = "details-row";
        const lastJob = r._lastJob ? fmtDate(r._lastJob) : "—";
        const lastWash = r._lastWash ? fmtDate(r._lastWash) : "—";
        const lastJobName = r._lastJobName ? (" (" + r._lastJobName + ")") : "";
        dtr.innerHTML = `
          <td colspan="5">
            <div class="details">
              <div>
                <div class="k">Last on job</div>
                <div class="v">${lastJob}${lastJobName}</div>
              </div>
              <div>
                <div class="k">Last washed</div>
                <div class="v">${lastWash}</div>
              </div>
            </div>
          </td>
        `;
        tbody.appendChild(dtr);
      }
    });
  }

  async function loadAll(){
    try{
      const t = await jsonp(WEBAPP_URL, { action: "tents" });
      tents = (t && (t.tents || t.data || t)) || [];
      if (!Array.isArray(tents)) tents = [];
      tents = tents.map(normalizeTentRow);

      const l = await jsonp(WEBAPP_URL, { action: "log" });
      logRows = (l && (l.log || l.data || l)) || [];
      if (!Array.isArray(logRows)) logRows = [];
      logRows = logRows.map(normalizeLogRow);

      computeCurrent();
      fillFilters();
      render();
    }catch(e){
      console.error(e);
      document.getElementById("tbody").innerHTML =
        '<tr><td colspan="5" class="small">Could not load tents yet. (Apps Script response not in expected JSONP format.)</td></tr>';
      document.getElementById("summary").textContent = "Load failed";
    }
  }

  document.getElementById("filter-tent").addEventListener("change", render);
  document.getElementById("filter-grade").addEventListener("change", render);
  document.getElementById("filter-avail").addEventListener("change", render);

  document.getElementById("open-entry").addEventListener("click", ()=>{
    window.location.href = "tent_entry.html" + window.location.search;
  });

  // Drawer behavior
  (function(){
    var hamburger = document.getElementById("hamburger-btn");
    var drawer = document.getElementById("drawer");
    var overlay = document.getElementById("drawer-overlay");

    function openMenu(){
      drawer.classList.add("open");
      overlay.classList.add("open");
      drawer.setAttribute("aria-hidden","false");
      overlay.setAttribute("aria-hidden","false");
    }
    function closeMenu(){
      drawer.classList.remove("open");
      overlay.classList.remove("open");
      drawer.setAttribute("aria-hidden","true");
      overlay.setAttribute("aria-hidden","true");
    }
    function toggleMenu(){
      if (drawer.classList.contains("open")) closeMenu();
      else openMenu();
    }

    if (hamburger) hamburger.addEventListener("click", toggleMenu);
    if (overlay) overlay.addEventListener("click", closeMenu);
    document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeMenu(); });
  })();

  // Home link (Option 2): go back to the employee page that opened Tents; otherwise go to index.html
  (function () {
    try {
      var params = new URLSearchParams(window.location.search);
      var from = params.get("from");
      if (from && /^[A-Za-z0-9_-]+\.html$/.test(from)) {
        var home = document.getElementById("home-link");
        if (home) home.setAttribute("href", from);
      }
      // Propane link should keep the same query string so Home works there too.
      var propane = document.getElementById("propane-link");
      if (propane) propane.setAttribute("href", "propane.html" + window.location.search);
    } catch (e) {}
  })();

  loadAll();
</script>
</body>
</html>
