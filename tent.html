<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tents</title>
<style>
  :root {
    --bg:#f3f3f3; --card:#fff; --text:#111; --muted:#666;
    --shadow:0 10px 30px rgba(0,0,0,.08);
    --radius:18px;
  }
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .topbar{position:sticky;top:0;z-index:50;background:#f3f3f3; padding:14px 16px; display:flex; align-items:center; gap:12px;}
  .hamburger{width:44px;height:44px;border-radius:12px;border:1px solid #ddd;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.06);display:grid;place-items:center;cursor:pointer;}
  .hamburger svg{width:22px;height:22px;}
  .topbar-spacer{flex:1;}
  .pill-btn{border:0;background:#111;color:#fff;border-radius:18px;padding:12px 16px;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.12);}
  .container{max-width:820px;margin:0 auto;padding:12px 16px 32px;}
  h1{margin:10px 0 14px;font-size:44px;letter-spacing:-.5px;text-align:center;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select{padding:10px 12px;border-radius:12px;border:1px solid #ddd;background:#fff;min-width:150px;}
  .muted{color:var(--muted);}
  .list{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
  .item{background:#fafafa;border:1px solid #e8e8e8;border-radius:18px;padding:14px 14px 10px;cursor:pointer;}
  .item-head{display:flex;gap:12px;align-items:flex-start;}
  .badge{width:8px;border-radius:8px;align-self:stretch;}
  .avail{background:#2e7d32;}
  .unavail{background:#c62828;}
  .item-main{flex:1;}
  .item-title{font-size:28px;font-weight:800;margin:0 0 6px;}
  .kv{margin:0;line-height:1.45;}
  .kv b{display:inline-block;min-width:92px;}
  .reason{margin-top:8px;font-weight:800;}
  .reason small{font-weight:600;color:var(--muted);}
  .details{margin-top:10px;border-top:1px dashed #ddd;padding-top:10px;display:none;}
  .details.show{display:block;}
  .details-grid{display:grid;grid-template-columns:1fr;gap:6px;}
  .banner{margin-top:12px;text-align:center;color:var(--muted);}
  .error{color:#b00020;font-weight:700;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:100;}
  .overlay.show{display:block;}
  .drawer{position:fixed;top:0;left:0;height:100%;width:280px;background:#fff;box-shadow: 20px 0 40px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .2s ease;z-index:101;padding:18px;}
  .drawer.show{transform:translateX(0);}
  .drawer h2{margin:0 0 10px;font-size:22px;}
  .drawer a{display:block;padding:12px 10px;border-radius:12px;color:#111;text-decoration:none;font-weight:800;}
  .drawer a:hover{background:#f3f3f3;}
  .btn-link{display:inline-flex;align-items:center;gap:10px;text-decoration:none;}
</style>
</head>
<body>
  <div class="topbar">
    <button class="hamburger" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div class="topbar-spacer"></div>
    <button class="pill-btn" id="refreshBtn" title="Refresh">Refresh</button>
  </div>

  <div class="container">
    <h1>Tents</h1>

    <div class="card">
      <div class="row">
        <label class="muted">Tent</label>
        <select id="filterTent"></select>

        <label class="muted">Grade</label>
        <select id="filterGrade"></select>

        <label class="muted">Action</label>
        <select id="filterAction">
          <option value="">(any)</option>
          <option value="on job">On job</option>
          <option value="return">Return</option>
          <option value="washed">Washed</option>
          <option value="needs wash">Needs wash</option>
        </select>

        <button class="pill-btn" id="filterBtn">Filter</button>

        <a class="pill-btn btn-link" id="entryBtn" href="tent_entry.html">Tent Form</a>
      </div>

      <div id="status" class="banner muted">Loading…</div>
      <div id="list" class="list" aria-live="polite"></div>
    </div>
  </div>

  <div id="overlay" class="overlay"></div>
  <div id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Menu">
    <h2>Menu</h2>
    <a id="homeLink" href="index.html">Home</a>
    <a id="propaneLink" href="propane.html">Propane</a>
  </div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyebhRS2EkgZxJHpM6wTzGDvn6FmdNALrOkmo_jqte9rfrd1G64YaMDNYz68ynxZ0Ak/exec";

const qs = new URLSearchParams(location.search);
const from = qs.get("from"); // e.g. 64445533.html

function withFrom(file) {
  if(!from) return file;
  return file + "?from=" + encodeURIComponent(from);
}

document.getElementById("homeLink").href = from ? from : "index.html";
document.getElementById("propaneLink").href = withFrom("propane.html");
document.getElementById("entryBtn").href = withFrom("tent_entry.html");

const overlay = document.getElementById("overlay");
const drawer = document.getElementById("drawer");
document.getElementById("menuBtn").addEventListener("click", ()=>{
  overlay.classList.add("show"); drawer.classList.add("show");
});
overlay.addEventListener("click", ()=>{
  overlay.classList.remove("show"); drawer.classList.remove("show");
});

const elStatus = document.getElementById("status");
const elList = document.getElementById("list");
const filterTent = document.getElementById("filterTent");
const filterGrade = document.getElementById("filterGrade");
const filterAction = document.getElementById("filterAction");

let allRows = [];

function fmtDate(dStr){
  if(!dStr) return "—";
  const d = new Date(dStr);
  if(isNaN(d.getTime())) return String(dStr);
  return d.toLocaleDateString();
}

function setSelectOptions(selectEl, values, placeholder){
  selectEl.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = placeholder;
  selectEl.appendChild(opt0);
  (values||[]).forEach(v=>{
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    selectEl.appendChild(o);
  });
}

function jsonp(url, params, timeoutMs=8000){
  return new Promise((resolve, reject)=>{
    const cbName = "__cb_" + Math.random().toString(36).slice(2);
    const u = new URL(url);
    Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k, v));
    u.searchParams.set("callback", cbName);

    let done = false;
    const t = setTimeout(()=>{
      if(done) return;
      done = true;
      cleanup();
      reject(new Error("Web app did not respond (timeout). Make sure the /exec URL is correct and returns JSONP."));
    }, timeoutMs);

    function cleanup(){
      clearTimeout(t);
      delete window[cbName];
      script.remove();
    }

    window[cbName] = (data)=>{
      if(done) return;
      done = true;
      cleanup();
      resolve(data);
    };

    const script = document.createElement("script");
    script.src = u.toString();
    script.onerror = ()=>{
      if(done) return;
      done = true;
      cleanup();
      reject(new Error("Failed to load web app script. Check deployment access (Anyone) and URL."));
    };
    document.head.appendChild(script);
  });
}

async function loadMeta(){
  const meta = await jsonp(WEB_APP_URL, { action: "meta" });
  if(!meta || meta.ok !== true) throw new Error(meta && meta.error ? meta.error : "Meta load failed");
  setSelectOptions(filterTent, meta.tentTypes || [], "(any)");
  setSelectOptions(filterGrade, meta.grades || [], "(any)");
}

function applyFilter(){
  const ft = filterTent.value;
  const fg = filterGrade.value;
  const fa = filterAction.value;

  let rows = allRows.slice();
  if(ft) rows = rows.filter(r=>r.tent === ft);
  if(fg) rows = rows.filter(r=>r.grade === fg);
  if(fa) rows = rows.filter(r=>r.action === fa);

  render(rows);
}

function render(rows){
  elList.innerHTML = "";
  if(!rows.length){
    elStatus.innerHTML = '<span class="muted">No tents match your filter.</span>';
    return;
  }
  elStatus.textContent = "";

  let openId = null;

  rows.forEach(r=>{
    const item = document.createElement("div");
    item.className = "item";

    const badge = document.createElement("div");
    badge.className = "badge " + (r.available ? "avail" : "unavail");

    const main = document.createElement("div");
    main.className = "item-main";

    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = `${r.tent} #${r.number}`;

    const p1 = document.createElement("p");
    p1.className = "kv";
    p1.innerHTML = `<b>Grade:</b> ${r.grade || "—"}`;

    const p2 = document.createElement("p");
    p2.className = "kv";
    const availText = r.available ? "Available" : "Unavailable";
    p2.innerHTML = `<b>Status:</b> ${availText} <span class="muted">(${r.action})</span>`;

    const reason = document.createElement("div");
    reason.className = "reason";
    if(!r.available){
      reason.innerHTML = r.reason ? `${r.reason}` : `<small>No reason recorded</small>`;
    } else {
      reason.innerHTML = r.notes ? `<small>${r.notes}</small>` : `<small>&nbsp;</small>`;
    }

    const details = document.createElement("div");
    details.className = "details";
    details.innerHTML = `
      <div class="details-grid">
        <div><b>Last on job:</b> ${fmtDate(r.lastJob)}${r.lastJobName ? " — " + r.lastJobName : ""}</div>
        <div><b>Last washed:</b> ${fmtDate(r.lastWash)}</div>
      </div>
    `;

    main.appendChild(title);
    main.appendChild(p1);
    main.appendChild(p2);
    main.appendChild(reason);
    main.appendChild(details);

    const head = document.createElement("div");
    head.className = "item-head";
    head.appendChild(badge);
    head.appendChild(main);

    item.appendChild(head);

    item.addEventListener("click", ()=>{
      elList.querySelectorAll(".details").forEach(d=>d.classList.remove("show"));
      if(openId === r.id){
        openId = null;
        return;
      }
      openId = r.id;
      details.classList.add("show");
    });

    elList.appendChild(item);
  });
}

async function loadCurrent(){
  elStatus.textContent = "Loading…";
  const data = await jsonp(WEB_APP_URL, { action: "tents" });
  if(!data || data.ok !== true) throw new Error(data && data.error ? data.error : "Load failed");

  allRows = (data.tents || []).map(t=>({
    id: t.id || (t.tent + "-" + t.number),
    tent: t.tent,
    number: t.number,
    grade: t.grade,
    notes: t.notes || "",
    action: String(t.action || "").toLowerCase(),
    available: !!t.available,
    reason: t.reason || "",
    lastJob: t.lastJob || "",
    lastJobName: t.lastJobName || "",
    lastWash: t.lastWash || ""
  }));

  allRows.sort((a,b)=>{
    const ta = (a.tent||"").localeCompare(b.tent||"");
    if(ta!==0) return ta;
    return Number(a.number) - Number(b.number);
  });

  applyFilter();
}

async function boot(){
  try{
    await loadMeta();
    await loadCurrent();
  } catch(e){
    console.error(e);
    elStatus.innerHTML = `<span class="error">${e.message}</span>`;
  }
}

document.getElementById("filterBtn").addEventListener("click", applyFilter);
document.getElementById("refreshBtn").addEventListener("click", boot);

boot();
</script>
</body>
</html>
