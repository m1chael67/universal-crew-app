<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="logo_resized.png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeff's Jobs - Universal Rentals</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    .clock-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .clock-row button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top-bar" style="position: fixed; top: 0; right: 0; padding: 0.5rem; font-size: 12px; background: white; z-index: 1000;">
    Hours this period: <span id="hour-counter">0</span>
  </div>
  <div class="container" style="margin-top: 2.5rem;">
    <div style="text-align:right;margin-bottom:8px;">
      <button id="logout-btn" type="button" style="font-size:12px;padding:4px 8px;cursor:pointer;">Log Out</button>
    </div>
    <h1>Jeff's Jobs</h1>
    <div class="clock-row">
      <button id="clock-in-btn" type="button">Clock In</button>
      <button id="clock-out-btn" type="button">Clock Out</button>
      <span id="clock-status" style="font-size:12px;color:#555;"></span>
    </div>
    <div id="job-list">Loading...</div>
  </div>

  <script>
    // Pay period helper: 14-day Saturday–Friday periods anchored at 2025-11-01
    function getPayPeriodInfo(date) {
      var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      var anchor = new Date(2025, 10, 1); // 2025-11-01 (Sat)
      var msPerDay = 24 * 60 * 60 * 1000;
      var daysDiff = Math.floor((d - anchor) / msPerDay);
      var periodIndex = Math.floor(daysDiff / 14);
      var start = new Date(anchor.getTime() + periodIndex * 14 * msPerDay);
      var end   = new Date(start.getTime() + 13 * msPerDay);
      var label = (start.getMonth()+1) + "/" + start.getDate() + " - " + (end.getMonth()+1) + "/" + end.getDate();
      var key   = "pp-" + start.getFullYear() + "-" + (start.getMonth()+1) + "-" + start.getDate();
      return { start: start, end: end, label: label, key: key };
    }

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMf8NcGG2ydJMGUOZGaY6ct_AQ6sfNG8FCY7szJ_bMVHtcNIhMkDcvRTBrRyCxgt0/exec";

    function formatJobDate(raw) {
      if (!raw) return "";

      var jsDate = null;

      if (raw instanceof Date) {
        jsDate = raw;
      } else if (typeof raw === "string") {
        if (raw.indexOf("Date(") === 0) {
          try {
            var inside = raw.replace("Date(", "").replace(")", "");
            var parts = inside.split(",");
            var y = parseInt(parts[0], 10);
            var m = parseInt(parts[1], 10);
            var d = parseInt(parts[2] || "1", 10);
            jsDate = new Date(y, m, d);
          } catch (e) {
            jsDate = null;
          }
        } else if (raw.indexOf("/") !== -1) {
          var bits = raw.split("/");
          var mm = parseInt(bits[0], 10);
          var dd = parseInt(bits[1], 10);
          var yyyy = parseInt(bits[2], 10);
          if (!isNaN(mm) && !isNaN(dd) && !isNaN(yyyy)) {
            jsDate = new Date(yyyy, mm - 1, dd);
          }
        }
      }

      if (!jsDate || isNaN(jsDate.getTime())) {
        return String(raw);
      }

      var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var dow = days[jsDate.getDay()];

      var mmStr = String(jsDate.getMonth() + 1).padStart(2, "0");
      var ddStr = String(jsDate.getDate()).padStart(2, "0");
      var yyyyStr = jsDate.getFullYear();

      return dow + " - " + mmStr + "/" + ddStr + "/" + yyyyStr;
    }

    const FILTER_EMPLOYEE = "Jeff";
    const currentEmployee = localStorage.getItem("employee") || "Jeff";

    // Clock in / out + send to Apps Script + email
    (function initClock() {
      var now = new Date();
      var pp = getPayPeriodInfo(now);
      var periodKey = pp.key;
      var hoursKey = "hours-" + periodKey + "-" + currentEmployee;
      var clockInKey = "clockin-" + periodKey + "-" + currentEmployee;

      var storedHours = parseFloat(localStorage.getItem(hoursKey) || "0");
      if (isNaN(storedHours)) storedHours = 0;
      var counterEl = document.getElementById("hour-counter");
      if (counterEl) counterEl.textContent = storedHours.toFixed(2);

      var clockStatusEl = document.getElementById("clock-status");
      if (localStorage.getItem(clockInKey) && clockStatusEl) {
        clockStatusEl.textContent = "Currently clocked in.";
      }

	  function sendClockEvent(eventType, hoursDelta) {
	    try {
	      var nowTs = new Date();
	      var ppNow = getPayPeriodInfo(nowTs);

	      var payload = new URLSearchParams({
	        employee: currentEmployee,
	        event: eventType === "Clock In" ? "clock_in" : "clock_out",
	        timestamp: nowTs.toISOString(),
	        periodKey: ppNow.key,
	        hours: String(hoursDelta || 0)
	      });

	      // 1) Log hours to Apps Script
	      fetch(WEB_APP_URL, {
	        method: "POST",
	        mode: "no-cors",
	        keepalive: true,
	        headers: { "Content-Type": "application/x-www-form-urlencoded" },
	        body: payload
	      }).catch(function(err) {
	        console.error("Log to Apps Script failed", err);
	      });

	      // 2) Send email via FormSubmit, but as a background fetch (no redirect)
	      var emailPayload = new URLSearchParams({
	        Event: eventType,
	        Employee: currentEmployee,
	        Timestamp: new Date().toString(),
	        _captcha: "false"
	        // no _next => no redirect
	      });

	      fetch("https://formsubmit.co/michaellazarov12@gmail.com", {
	        method: "POST",
	        mode: "no-cors",
	        body: emailPayload
	      }).catch(function(err) {
	        console.error("FormSubmit email failed", err);
	      });

	    } catch (e) {
	      console.error("Error in sendClockEvent", e);
	    }
	  }
	  
      var clockInBtn = document.getElementById("clock-in-btn");
      var clockOutBtn = document.getElementById("clock-out-btn");

      if (clockInBtn) {
        clockInBtn.addEventListener("click", function () {
          if (localStorage.getItem(clockInKey)) {
            alert("You are already clocked in.");
            return;
          }
          var nowTs = new Date();
          localStorage.setItem(clockInKey, nowTs.toISOString());
          if (clockStatusEl) clockStatusEl.textContent = "Currently clocked in.";
          sendClockEvent("Clock In", 0);
        });
      }

      if (clockOutBtn) {
        clockOutBtn.addEventListener("click", function () {
          var startIso = localStorage.getItem(clockInKey);
          if (!startIso) {
            alert("You are not currently clocked in.");
            return;
          }
          var startDate = new Date(startIso);
          var endDate = new Date();
          var diffMs = endDate - startDate;
          var diffHours = diffMs / 36e5;

          storedHours += diffHours;
          localStorage.setItem(hoursKey, String(storedHours));
          if (counterEl) counterEl.textContent = storedHours.toFixed(2);

          localStorage.removeItem(clockInKey);
          if (clockStatusEl) clockStatusEl.textContent = "Last session: " + diffHours.toFixed(2) + " hrs added.";
          sendClockEvent("Clock Out", diffHours);
        });
      }
    })();

    // Logout button
    (function() {
      var btn = document.getElementById("logout-btn");
      if (!btn) return;
      btn.addEventListener("click", function() {
        try {
          localStorage.removeItem("employee");
          localStorage.removeItem("clockedIn");
        } catch (e) {}
        window.location.href = "index.html";
      });
    })();

    // Job loading with employee filter
    (function loadJobs() {
      var sheetId = "1EXRZrzTEGMCG2ceIKg7ZkAZHPOMZojz7n00hAs2a5FA";
      var sheetUrl = "https://docs.google.com/spreadsheets/d/" + sheetId + "/gviz/tq?tqx=out:json";

      fetch(sheetUrl)
        .then(function(res) { return res.text(); })
        .then(function(text) {
          var json = JSON.parse(text.substring(47).slice(0, -2));
          var rows = json.table.rows;
          // Prefer formatted values when available (e.g. "11/20/2025")
          var data = rows.map(function(r) {
            return r.c.map(function(c) {
              if (!c) return "";
              if (typeof c.f !== "undefined" && c.f !== null) return c.f;
              if (typeof c.v !== "undefined" && c.v !== null) return c.v;
              return "";
            });
          });

          var jobsByNameDate = {};

          data.forEach(function(row) {
            // Name, Address, Phone, Date, Item, Qty, Type, Note, All, Michael, Tim, Joe, Jeff
            var Name        = row[0];
            var Address     = row[1];
            var Phone       = row[2];
            var DateStr     = row[3];
            var Item        = row[4];
            var Quantity    = row[5];
            var Type        = row[6];
            var Note        = row[7];
            var AllCol      = row[8];
            var MichaelCol  = row[9];
            var TimCol      = row[10];
            var JoeCol      = row[11];
            var JeffCol     = row[12];

            if (!Name || !DateStr) return;

            var dateKey = DateStr;
            if (dateKey && typeof dateKey === "object" && dateKey.getMonth) {
              var mm = dateKey.getMonth() + 1;
              var dd = dateKey.getDate();
              var yyyy = dateKey.getFullYear();
              dateKey = mm + "/" + dd + "/" + yyyy;
            } else if (typeof dateKey === "string" && dateKey.indexOf("Date(") === 0) {
              // Handle strings like "Date(2025,10,20)"
              var m = dateKey.match(/Date\((\d+),(\d+),(\d+)\)/);
              if (m) {
                var yyyy = parseInt(m[1], 10);
                var mm = parseInt(m[2], 10) + 1; // month is 0-based in this format
                var dd = parseInt(m[3], 10);
                dateKey = mm + "/" + dd + "/" + yyyy;
              }
            }

            // Determine if this job should show on this employee page
            var hasAll = AllCol && String(AllCol).trim() !== "";
            var show = false;
            if (!FILTER_EMPLOYEE) {
              show = true;
            } else {
              var fname = FILTER_EMPLOYEE;
              var hasEmployee = false;
              if (fname === "Michael" && MichaelCol && String(MichaelCol).trim() !== "") hasEmployee = true;
              if (fname === "Tim" && TimCol && String(TimCol).trim() !== "") hasEmployee = true;
              if (fname === "Joe" && JoeCol && String(JoeCol).trim() !== "") hasEmployee = true;
              if (fname === "Jeff" && JeffCol && String(JeffCol).trim() !== "") hasEmployee = true;
              if (hasAll || hasEmployee) show = true;
            }
            if (!show) return;

            var key = Name + dateKey;
            if (!jobsByNameDate[key]) {
              jobsByNameDate[key] = {
                Name: Name,
                Date: dateKey,
                Type: Type,
                Address: Address,
                Phone: Phone,
                crew: {},
                inventory: []
              };
            }

            var job = jobsByNameDate[key];

            // Track crew columns
            if (AllCol && String(AllCol).trim() !== "") job.crew.all = true;
            if (MichaelCol && String(MichaelCol).trim() !== "") job.crew.michael = true;
            if (TimCol && String(TimCol).trim() !== "") job.crew.tim = true;
            if (JoeCol && String(JoeCol).trim() !== "") job.crew.joe = true;
            if (JeffCol && String(JeffCol).trim() !== "") job.crew.jeff = true;

            job.inventory.push({
              Item: Item,
              Quantity: Quantity,
              Note: Note
            });
          });

          var list = document.getElementById("job-list");
          list.innerHTML = "";

          var jobsArray = Object.values(jobsByNameDate);
          // Sort by date ascending (if parsable)
          jobsArray.sort(function(a, b) {
            var da = Date.parse(a.Date) || 0;
            var db = Date.parse(b.Date) || 0;
            return da - db;
          });

          jobsArray.forEach(function(job) {
            var block = document.createElement("div");
            block.className = "job-block";

            var crewNames = [];
            if (job.crew.michael) crewNames.push("Michael");
            if (job.crew.tim) crewNames.push("Tim");
            if (job.crew.joe) crewNames.push("Joe");
            if (job.crew.jeff) crewNames.push("Jeff");
            var crewLabel = "";
            if (crewNames.length) {
              crewLabel = crewNames.join(", ");
            } else if (job.crew.all) {
              crewLabel = "All crew";
            }

            // Type color (Pickup = blue, Setup = green, Strike = red)
            var typeColor = "#333";
            if (job.Type && typeof job.Type === "string") {
              var t = job.Type.toLowerCase();
              if (t.includes("pickup") || t.includes("pick-up") || t.includes("pick up")) {
                typeColor = "#1e88e5";      // Pickup
              } else if (t.includes("setup") || t.includes("set-up") || t.includes("set up")) {
                typeColor = "#43a047";      // Setup
              } else if (t.includes("strike")) {
                typeColor = "#e53935";      // Strike
              }
            }

            block.style.borderLeft = "4px solid " + typeColor;

            var inventoryHtml = job.inventory.map(function(i) {
              var notePart = i.Note ? ' <span style="color:red;">' + i.Note + '</span>' : '';
              var qtyPart = i.Quantity ? ' × ' + i.Quantity : '';
              return '<li>' + (i.Item || '') + qtyPart + notePart + '</li>';
            }).join("");

            block.innerHTML = ''
              + '<div class="job-block-header">'
              +   '<h2>' + job.Name + '</h2>'
              +   '<span style="font-weight:bold;">' + formatJobDate(job.Date) + '</span>'
              + '</div>'
              + '<p><strong>Type:</strong> ' + (job.Type || '') + '</p>'
              + '<p><strong>Address:</strong> <span class="job-address" style="text-decoration:underline;cursor:pointer;">'
              +    (job.Address || '') + '</span></p>'
              + '<p><strong>Phone:</strong> <a href="tel:' + (job.Phone || '') + '">' + (job.Phone || '') + '</a></p>'
              + (crewLabel ? '<p><strong>Crew:</strong> ' + crewLabel + '</p>' : '')
              + '<div class="job-inventory"><h3>Inventory</h3>'
              + '<ul>' + inventoryHtml + '</ul></div>';

            list.appendChild(block);
          });

          // Click-to-copy address
          list.addEventListener("click", function(ev) {
            var target = ev.target;
            if (target.classList.contains("job-address")) {
              var addr = target.textContent || "";
              if (!addr) return;
              navigator.clipboard.writeText(addr).then(function() {
                target.style.backgroundColor = "#fffa9c";
                setTimeout(function() { target.style.backgroundColor = ""; }, 400);
              }).catch(function(err) {
                console.error("Copy failed", err);
              });
            }
          });
        })
        .catch(function(err) {
          console.error(err);
          var list = document.getElementById("job-list");
          list.textContent = "Failed to load jobs.";
        });
    })();
  </script>
</body>
</html>
