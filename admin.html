<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin – Crew Hours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-bar" style="position:fixed;top:0;right:0;padding:0.5rem;font-size:12px;background:#fff;z-index:1000;">
    Pay period: <span id="pay-period-label">Loading...</span>
  </div>

  <div class="container" style="margin-top:2.5rem;">
    <h1>Admin – Crew Hours</h1>
    <p id="admin-status" style="font-size:14px;color:#555;">Loading hours...</p>

    <table style="width:100%;border-collapse:collapse;margin-top:1rem;">
      <thead>
        <tr>
          <th style="text-align:left;border-bottom:1px solid #ddd;padding:4px 8px;">Employee</th>
          <th style="text-align:right;border-bottom:1px solid #ddd;padding:4px 8px;">Hours this period</th>
        </tr>
      </thead>
      <tbody id="hours-body">
      </tbody>
    </table>
  </div>

  <script>
    const TIME_LOG_SHEET_ID = "1gm39kMipfpLKS2n8g9F4SYG9Do36M_5Lc6GOs-c6jCM";

    function getPayPeriodInfo(date) {
      var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      var anchor = new Date(2025, 10, 1); // 2025-11-01 (month is 0-based)
      var msPerDay = 24 * 60 * 60 * 1000;
      var daysDiff = Math.floor((d - anchor) / msPerDay);
      var periodIndex = Math.floor(daysDiff / 14);
      var start = new Date(anchor.getTime() + periodIndex * 14 * msPerDay);
      var end   = new Date(start.getTime() + 13 * msPerDay);
      var label = (start.getMonth() + 1) + "/" + start.getDate() +
                  " - " + (end.getMonth() + 1) + "/" + end.getDate();
      var key   = "pp-" + start.getFullYear() + "-" +
                  (start.getMonth() + 1) + "-" + start.getDate();
      return { start: start, end: end, label: label, key: key };
    }

    function loadAdminHours() {
      var now = new Date();
      var pp = getPayPeriodInfo(now);
      var periodKey = pp.key;

      var labelEl = document.getElementById("pay-period-label");
      if (labelEl) labelEl.textContent = pp.label;

      var tq =
        "select B, sum(F) " +
        "where C = 'clock_out' " +
        "and D = '" + periodKey + "' " +
        "group by B " +
        "label sum(F) ''";

      var url =
        "https://docs.google.com/spreadsheets/d/" +
        TIME_LOG_SHEET_ID +
        "/gviz/tq?tqx=out:json&sheet=Time%20Log&headers=1&tq=" +
        encodeURIComponent(tq);

      fetch(url)
        .then(function(res) { return res.text(); })
        .then(function(text) {
          var statusEl = document.getElementById("admin-status");
          var bodyEl   = document.getElementById("hours-body");

          var json = JSON.parse(text.substring(47).slice(0, - 2));
          var rows = json.table.rows || [];

          if (!rows.length) {
            if (statusEl) statusEl.textContent = "No hours logged for this period yet.";
            return;
          }

          if (statusEl) statusEl.textContent = "";

          bodyEl.innerHTML = "";
          rows.forEach(function(row) {
            var empCell   = row.c[0];
            var hoursCell = row.c[1];
            if (!empCell || !hoursCell) return;

            var name = String(empCell.v || "");
            var hrs  = Number(hoursCell.v || 0);

            var tr = document.createElement("tr");
            tr.innerHTML =
              "<td style='padding:4px 8px;border-bottom:1px solid #f0f0f0;'>" + name + "</td>" +
              "<td style='padding:4px 8px;border-bottom:1px solid #f0f0f0;text-align:right;'>" +
              hrs.toFixed(2) + "</td>";
            bodyEl.appendChild(tr);
          });
        })
        .catch(function(err) {
          console.error("Failed to load admin hours", err);
          var statusEl = document.getElementById("admin-status");
          if (statusEl) statusEl.textContent = "Failed to load hours.";
        });
    }

    document.addEventListener("DOMContentLoaded", loadAdminHours);
  </script>
</body>
</html>
