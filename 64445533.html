  <script>
    // Pay period helper: 14-day Saturday–Friday periods anchored at 2025-11-01
    function getPayPeriodInfo(date) {
      // 14-day pay periods: Saturday -> Friday, anchored at Sat 2025-11-01.
      // PeriodKey represents the END Friday: "pp-YYYY-M-D"
      var d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0); // local noon avoids DST/UTC drift
      var anchorStart = new Date(2025, 10, 1, 12, 0, 0); // 2025-11-01 (Sat)
      var msPerDay = 24 * 60 * 60 * 1000;

      var daysDiff = Math.floor((d.getTime() - anchorStart.getTime()) / msPerDay);
      var periodIndex = Math.floor(daysDiff / 14);

      var start = new Date(anchorStart.getTime() + periodIndex * 14 * msPerDay);
      var end   = new Date(start.getTime() + 13 * msPerDay);

      var key = "pp-" + end.getFullYear() + "-" + (end.getMonth() + 1) + "-" + end.getDate();
      var label = (start.getMonth() + 1) + "/" + start.getDate() + "/" + start.getFullYear() +
                  " - " + (end.getMonth() + 1) + "/" + end.getDate() + "/" + end.getFullYear();

      return { start: start, end: end, key: key, label: label };
    }

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwDMoZjhy2IHA0PFEqSwd79cOteIBX-QhIVjLh8pXHnzm6frGjoO1FkS9_xrdIQh8M/exec";

    const TIME_LOG_SHEET_ID = "1gm39kMipfpLKS2n8g9F4SYG9Do36M_5Lc6GOs-c6jCM";
    const EMPLOYEE_NAME = "Michael";
function parseGvizResponse(textResp) {
      // Google Visualization responses wrap JSON; parse robustly across browsers.
      var start = textResp.indexOf("{");
      var end = textResp.lastIndexOf("}");
      if (start === -1 || end === -1 || end <= start) throw new Error("Invalid gviz response");
      return JSON.parse(textResp.substring(start, end + 1));
    }

function parseSheetDateTime(cell) {
  if (!cell) return null;
  var value = null;
  if (typeof cell.v !== "undefined" && cell.v !== null) {
    value = cell.v;
  } else if (typeof cell.f !== "undefined" && cell.f !== null) {
    value = cell.f;
  }
  if (!value) return null;

  if (value instanceof Date) {
    return value;
  }

  if (typeof value === "string") {
    if (value.indexOf("Date(") === 0) {
      try {
        var m = value.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
        if (m) {
          var year  = parseInt(m[1], 10);
          var month = parseInt(m[2], 10);
          var day   = parseInt(m[3], 10);
          var hh    = m[4] ? parseInt(m[4], 10) : 0;
          var mm    = m[5] ? parseInt(m[5], 10) : 0;
          var ss    = m[6] ? parseInt(m[6], 10) : 0;
          return new Date(year, month, day, hh, mm, ss);
        }
      } catch (e) {
        return null;
      }
    } else {
      var t = Date.parse(value);
      if (!isNaN(t)) return new Date(t);
    }
  }

  return null;
}



    function formatJobDate(raw) {
      if (!raw) return "";

      var jsDate = null;

      if (raw instanceof Date) {
        jsDate = raw;
      } else if (typeof raw === "string") {
        if (raw.indexOf("Date(") === 0) {
          try {
            var inside = raw.replace("Date(", "").replace(")", "");
            var parts = inside.split(",");
            var y = parseInt(parts[0], 10);
            var m = parseInt(parts[1], 10);
            var d = parseInt(parts[2] || "1", 10);
            jsDate = new Date(y, m, d);
          } catch (e) {
            jsDate = null;
          }
        } else if (raw.indexOf("/") !== -1) {
          var bits = raw.split("/");
          var mm = parseInt(bits[0], 10);
          var dd = parseInt(bits[1], 10);
          var yyyy = parseInt(bits[2], 10);
          if (!isNaN(mm) && !isNaN(dd) && !isNaN(yyyy)) {
            jsDate = new Date(yyyy, mm - 1, dd);
          }
        }
      }

      if (!jsDate || isNaN(jsDate.getTime())) {
        return String(raw);
      }

      var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var dow = days[jsDate.getDay()];

      var mmStr = String(jsDate.getMonth() + 1).padStart(2, "0");
      var ddStr = String(jsDate.getDate()).padStart(2, "0");
      var yyyyStr = jsDate.getFullYear();

      return dow + " - " + mmStr + "/" + ddStr + "/" + yyyyStr;
    }

    const FILTER_EMPLOYEE = "Michael";
    const currentEmployee = "Michael";

// Clock in / out + send to Apps Script + email

(function initClock() {
  var clockStatusEl = document.getElementById("clock-status");
  var toggleBtn = document.getElementById("clock-toggle-btn");
  if (!toggleBtn) return;

  function setBtn(state) {
    toggleBtn.disabled = false;
    toggleBtn.dataset.state = state;
    if (state === "in") {
      toggleBtn.textContent = "Clock Out";
      toggleBtn.className = "btn warn";
    } else {
      toggleBtn.textContent = "Clock In";
      toggleBtn.className = "btn primary";
    }
  }

  function fetchClockStateFromSheet(callback) {
    try {
      var now = new Date();
      var pp = getPayPeriodInfo(now);
      var periodKey = pp.key;

      var tq =
        "select A, C " +
        "where D = '" + periodKey + "' " +
        "and B = '" + EMPLOYEE_NAME + "' " +
        "order by A";

      var baseUrl = "https://docs.google.com/spreadsheets/d/" + TIME_LOG_SHEET_ID + "/gviz/tq";
      var url = baseUrl +
        "?sheet=" + encodeURIComponent("Time Log") +
        "&headers=1" +
        "&tqx=out:json" +
        "&tq=" + encodeURIComponent(tq);

      fetch(url)
        .then(function(res) { return res.text(); })
        .then(function(textResp) {
          var json = JSON.parse(textResp.substring(47).slice(0, -2));
          var rows = json.table.rows || [];

          var state = "out";
          var lastClockIn = null;

          rows.forEach(function(row) {
            var tsCell  = row.c[0];
            var evtCell = row.c[1];
            if (!evtCell) return;
            var evt = String(evtCell.v || "");
            var ts  = parseSheetDateTime(tsCell);
            if (!evt) return;

            if (evt === "clock_in") {
              state = "in";
              if (ts) lastClockIn = ts;
            } else if (evt === "clock_out") {
              state = "out";
              lastClockIn = null;
            }
          });

          callback({
            state: state,
            lastClockIn: lastClockIn,
            error: false
          });
        })
        .catch(function(err) {
          console.error("Failed to fetch clock state", err);
          callback({ state: "out", lastClockIn: null, error: true });
        });
    } catch (e) {
      console.error("Error building clock-state query", e);
      callback({ state: "out", lastClockIn: null, error: true });
    }
  }

function waitForClockState(expectedState, triesLeft) {
    triesLeft = (typeof triesLeft === "number") ? triesLeft : 10; // ~10s max
    fetchClockStateFromSheet(function(info) {
      if (!info.error && info.state === expectedState) {
        refreshClockStatus();
        if (typeof loadHoursFromSheet === "function") loadHoursFromSheet();
        return;
      }
      if (triesLeft <= 0) {
        // Fall back to a normal refresh (whatever the sheet says now)
        refreshClockStatus();
        if (typeof loadHoursFromSheet === "function") loadHoursFromSheet();
        return;
      }
      setTimeout(function() { waitForClockState(expectedState, triesLeft - 1); }, 1000);
    });
  }


  function refreshClockStatus() {
    if (clockStatusEl) clockStatusEl.textContent = "Checking status...";
    toggleBtn.disabled = true;

    fetchClockStateFromSheet(function(info) {
      if (info.error) {
        if (clockStatusEl) clockStatusEl.textContent = "Could not reach timesheet.";
        setBtn("out");
        return;
      }

      if (info.state === "in") {
        if (clockStatusEl) {
          clockStatusEl.textContent = info.lastClockIn
            ? ("Clocked in since " + info.lastClockIn.toLocaleString())
            : "Clocked in.";
        }
        setBtn("in");
      } else {
        if (clockStatusEl) clockStatusEl.textContent = "Currently clocked out.";
        setBtn("out");
      }
    });
  }

  function sendClockEvent(eventType, hoursDelta) {
    try {
      var nowTs = new Date();
      var ppNow = getPayPeriodInfo(nowTs);

      var payload = new URLSearchParams({
        employee: EMPLOYEE_NAME,
        event: eventType === "Clock In" ? "clock_in" : "clock_out",
        timestamp: nowTs.toISOString(),
        periodKey: ppNow.key,
        hours: String(hoursDelta || 0)
      });

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: payload
      }).catch(function(err) {
        console.error("Log to Apps Script failed", err);
      });

      var emailPayload = new URLSearchParams({
        Event: eventType,
        Employee: EMPLOYEE_NAME,
        Timestamp: new Date().toString(),
        _captcha: "false"
      });

      fetch("https://formsubmit.co/michaellazarov12@gmail.com", {
        method: "POST",
        mode: "no-cors",
        body: emailPayload
      }).catch(function(err) {
        console.error("FormSubmit email failed", err);
      });
    } catch (e) {
      console.error("Error in sendClockEvent", e);
    }
  }

  toggleBtn.addEventListener("click", function () {
    toggleBtn.disabled = true;

    fetchClockStateFromSheet(function(info) {
      if (info.error) {
        alert("Couldn't reach timesheet. Try again in a moment.");
        refreshClockStatus();
        return;
      }

      var doClockOut = (info.state === "in");
      var eventType = doClockOut ? "Clock Out" : "Clock In";

      sendClockEvent(eventType, 0);

      setTimeout(function() { waitForClockState(doClockOut ? "out" : "in"); }, 600);
    });
  });

  refreshClockStatus();
})();

    // Job loading with employee filter
    function safeCellValue(c) {
      if (!c) return "";
      if (typeof c.f !== "undefined" && c.f !== null && c.f !== "") return c.f;
      if (typeof c.v !== "undefined" && c.v !== null) return c.v;
      return "";
    }

    function parseUsDate(raw) {
      if (!raw) return null;
      if (raw instanceof Date) return new Date(raw.getFullYear(), raw.getMonth(), raw.getDate());
      if (typeof raw === "string" && raw.indexOf("Date(") === 0) {
        var m = raw.match(/Date\((\d+),(\d+),(\d+)\)/);
        if (m) return new Date(parseInt(m[1],10), parseInt(m[2],10), parseInt(m[3],10));
      }
      var s = String(raw).trim();
      var m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (m2) {
        var mm = parseInt(m2[1], 10);
        var dd = parseInt(m2[2], 10);
        var yy = parseInt(m2[3], 10);
        if (yy < 100) yy += 2000;
        return new Date(yy, mm - 1, dd);
      }
      var t = Date.parse(s);
      if (!isNaN(t)) {
        var d = new Date(t);
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }
      return null;
    }

    function sameDay(a, b) {
      return a && b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function formatShortDate(d) {
      return (d.getMonth() + 1) + "/" + d.getDate() + "/" + d.getFullYear();
    }

    function formatHeaderDate(d) {
      var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      return days[d.getDay()] + " " + (d.getMonth() + 1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(-2);
    }

    function formatLongDayDate(d) {
      var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      return days[d.getDay()] + ": " + formatShortDate(d);
    }

    function buildDateLabel(setupDate, strikeDate, showAsStrikeOnly) {
      if (showAsStrikeOnly) {
        return "Strike - " + formatLongDayDate(strikeDate);
      }
      if (setupDate && strikeDate) {
        if (sameDay(setupDate, strikeDate)) {
          return formatShortDate(setupDate) + " - SAME DAY STRIKE";
        }
        return formatLongDayDate(setupDate) + " - " + formatLongDayDate(strikeDate);
      }
      if (setupDate) return formatLongDayDate(setupDate);
      if (strikeDate) return "Strike - " + formatLongDayDate(strikeDate);
      return "";
    }

    function renderCurrentDateChip() {
      var el = document.getElementById("current-date-chip");
      if (!el) return;
      var now = new Date();
      el.textContent = formatHeaderDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
    }

    (function loadJobs() {
      renderCurrentDateChip();

      var sheetId = "1EXRZrzTEGMCG2ceIKg7ZkAZHPOMZojz7n00hAs2a5FA";
      var sheetUrl = "https://docs.google.com/spreadsheets/d/" + sheetId + "/gviz/tq?tqx=out:json";

      fetch(sheetUrl)
        .then(function(res) { return res.text(); })
        .then(function(text) {
          var json = JSON.parse(text.substring(47).slice(0, -2));
          var rows = json.table.rows || [];
          var cols = (json.table.cols || []).map(function(col, idx) {
            return (col.label || col.id || ("col" + idx)).trim();
          });

          var today = new Date();
          today = new Date(today.getFullYear(), today.getMonth(), today.getDate());

          var jobsByKey = {};

          rows.forEach(function(r) {
            var row = {};
            cols.forEach(function(label, idx) {
              row[label] = safeCellValue(r.c[idx]);
            });

            var name = row["Name"] || "";
            var address = row["Address"] || "";
            var phone = row["Phone"] || "";
            var setupRaw = row["Date"] || "";
            var strikeRaw = row["Strike"] || "";
            var item = row["Inventory"] || row["Item"] || "";
            var quantity = row["Quantity"] || "";
            var type = row["Type"] || "";
            var note = row["Notes"] || "";
            var allCol = row["All"] || "";
            var michaelCol = row["Michael"] || "";
            var timCol = row["Tim"] || "";
            var joeCol = row["Joe"] || "";
            var jeffCol = row["Jeff"] || "";

            if (!name) return;

            var setupDate = parseUsDate(setupRaw);
            var strikeDate = parseUsDate(strikeRaw);

            if (!setupDate && !strikeDate) return;

            var hasAll = allCol && String(allCol).trim() !== "";
            var show = false;
            if (!FILTER_EMPLOYEE) {
              show = true;
            } else {
              var fname = FILTER_EMPLOYEE;
              var hasEmployee = false;
              if (fname === "Michael" && michaelCol && String(michaelCol).trim() !== "") hasEmployee = true;
              if (fname === "Tim" && timCol && String(timCol).trim() !== "") hasEmployee = true;
              if (fname === "Joe" && joeCol && String(joeCol).trim() !== "") hasEmployee = true;
              if (fname === "Jeff" && jeffCol && String(jeffCol).trim() !== "") hasEmployee = true;
              if (hasAll || hasEmployee) show = true;
            }
            if (!show) return;

            if (strikeDate && strikeDate < today) return;
            if (!strikeDate && setupDate && setupDate < today) return;

            var showAsStrikeOnly = false;
            var activeDate = setupDate || strikeDate;

            if (setupDate && setupDate < today && strikeDate && strikeDate >= today) {
              showAsStrikeOnly = true;
              activeDate = strikeDate;
            } else if (setupDate && setupDate >= today) {
              activeDate = setupDate;
            } else if (strikeDate) {
              activeDate = strikeDate;
            }

            var key = name + "|" + (setupDate ? setupDate.getTime() : "") + "|" + (strikeDate ? strikeDate.getTime() : "");

            if (!jobsByKey[key]) {
              jobsByKey[key] = {
                Name: name,
                SetupDate: setupDate,
                StrikeDate: strikeDate,
                ActiveDate: activeDate,
                showAsStrikeOnly: showAsStrikeOnly,
                DateLabel: buildDateLabel(setupDate, strikeDate, showAsStrikeOnly),
                Type: showAsStrikeOnly ? "Strike" : type,
                Address: address,
                Phone: phone,
                crew: {},
                inventory: []
              };
            }

            var job = jobsByKey[key];
            if (hasAll) job.crew.all = true;
            if (michaelCol && String(michaelCol).trim() !== "") job.crew.michael = true;
            if (timCol && String(timCol).trim() !== "") job.crew.tim = true;
            if (joeCol && String(joeCol).trim() !== "") job.crew.joe = true;
            if (jeffCol && String(jeffCol).trim() !== "") job.crew.jeff = true;

            job.inventory.push({
              Item: item,
              Quantity: quantity,
              Note: note
            });
          });

          var list = document.getElementById("job-list");
          list.innerHTML = "";

          var jobsArray = Object.values(jobsByKey);
          jobsArray.sort(function(a, b) {
            var da = a.ActiveDate ? a.ActiveDate.getTime() : 0;
            var db = b.ActiveDate ? b.ActiveDate.getTime() : 0;
            return da - db;
          });

          if (!jobsArray.length) {
            list.textContent = "No jobs scheduled.";
            return;
          }

          jobsArray.forEach(function(job) {
            var block = document.createElement("div");
            block.className = "job-block";

            var crewNames = [];
            if (job.crew.michael) crewNames.push("Michael");
            if (job.crew.tim) crewNames.push("Tim");
            if (job.crew.joe) crewNames.push("Joe");
            if (job.crew.jeff) crewNames.push("Jeff");
            var crewLabel = "";
            if (crewNames.length) {
              crewLabel = crewNames.join(", ");
            } else if (job.crew.all) {
              crewLabel = "All crew";
            }

            var typeColor = "#333";
            if (job.Type && typeof job.Type === "string") {
              var t = job.Type.toLowerCase();
              if (t.includes("pickup") || t.includes("pick-up") || t.includes("pick up")) {
                typeColor = "#1e88e5";
              } else if (t.includes("setup") || t.includes("set-up") || t.includes("set up")) {
                typeColor = "#43a047";
              } else if (t.includes("strike")) {
                typeColor = "#e53935";
              }
            }

            block.style.borderLeft = "4px solid " + typeColor;

            var isToday = job.ActiveDate && sameDay(job.ActiveDate, today);

            var inventoryHtml = job.inventory.map(function(i) {
              var qtyPart = i.Quantity ? " × " + i.Quantity : "";
              var notePart = i.Note ? '<span class="inventory-note">' + i.Note + '</span>' : "";
              return '<li class="inventory-row"><span class="inventory-main">' + (i.Item || '') + qtyPart + '</span>' + notePart + '</li>';
            }).join("");

            block.innerHTML = ''
              + '<div class="job-block-header">'
              +   '<h2>' + job.Name + '</h2>'
              +   '<span class="job-date-badge' + (isToday ? ' today' : '') + '">' + job.DateLabel + '</span>'
              + '</div>'
              + '<p><strong>Type:</strong> ' + (job.Type || '') + '</p>'
              + '<p><strong>Address:</strong> <span class="job-address" style="text-decoration:underline;cursor:pointer;">'
              +    (job.Address || '') + '</span></p>'
              + ((job.Phone && String(job.Phone).trim()) ? ('<p><strong>Phone:</strong> <a href="tel:' + job.Phone + '">' + job.Phone + '</a></p>') : '')
              + (crewLabel ? '<p><strong>Crew:</strong> ' + crewLabel + '</p>' : '')
              + '<div class="job-inventory"><h3>Inventory</h3>'
              + '<ul>' + inventoryHtml + '</ul></div>';

            list.appendChild(block);
          });

          list.addEventListener("click", function(ev) {
            var target = ev.target;
            if (target.classList.contains("job-address")) {
              var addr = target.textContent || "";
              if (!addr) return;
              navigator.clipboard.writeText(addr).then(function() {
                target.style.backgroundColor = "#fffa9c";
                setTimeout(function() { target.style.backgroundColor = ""; }, 400);
              }).catch(function(err) {
                console.error("Copy failed", err);
              });
            }
          });
        })
        .catch(function(err) {
          console.error(err);
          var list = document.getElementById("job-list");
          list.textContent = "Failed to load jobs.";
        });
    })();

    function loadHoursFromSheet() {
      try {
        var now = new Date();
        var pp = getPayPeriodInfo(now);
        var periodKey = pp.key;

        var tq =
          "select sum(F) " +
          "where C = 'clock_out' " +
          "and D = '" + periodKey + "' " +
          "and B = '" + EMPLOYEE_NAME + "' " +
          "group by D, B " +
          "label sum(F) ''";

        var baseUrl = "https://docs.google.com/spreadsheets/d/" + TIME_LOG_SHEET_ID + "/gviz/tq";
        var url = baseUrl +
          "?sheet=" + encodeURIComponent("Time Log") +
          "&headers=1" +
          "&tqx=out:json" +
          "&tq=" + encodeURIComponent(tq);

        fetch(url)
          .then(function(res) { return res.text(); })
          .then(function(textResp) {
            var json = parseGvizResponse(textResp);
            var rows = json.table.rows || [];
            var counterEl = document.getElementById("hour-counter");
            if (!counterEl) return;
            if (!rows.length || !rows[0] || !rows[0].c[0]) {
              counterEl.textContent = "0.00";
              return;
            }
            var hrs = Number(rows[0].c[0].v || 0);
            if (isNaN(hrs)) hrs = 0;
            counterEl.textContent = hrs.toFixed(2);
          })
          .catch(function(err) {
            console.error("Failed to load hours from sheet", err);
          });
      } catch (e) {
        console.error("Error building hours query", e);
      }
    }

    document.addEventListener("DOMContentLoaded", loadHoursFromSheet);


    // Hamburger menu wiring
    (function(){
      var btn = document.getElementById("menuBtn");
      var overlay = document.getElementById("menuOverlay");
      function closeMenu(){ document.body.classList.remove("menu-open"); }
      function openMenu(){ document.body.classList.add("menu-open"); }
      if (btn) btn.addEventListener("click", function(){
        if (document.body.classList.contains("menu-open")) closeMenu(); else openMenu();
      });
      if (overlay) overlay.addEventListener("click", closeMenu);
      // Close on ESC
      document.addEventListener("keydown", function(e){
        if (e.key === "Escape") closeMenu();
      });
    })();

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/universal-crew-app/service-worker.js');
    }

  </script>
