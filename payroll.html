<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payroll &amp; Attendance</title>
  <style>
    :root{--blue:#164a7b;--blue2:#0f365c;--green:#2e9d57;--green-bg:#dff4e6;--ink:#18212b;--muted:#637080;--line:#dce3ea;--bg:#f4f7fa;--card:#fff;--warn:#fff5d8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 44px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{color:var(--blue);text-decoration:none;font-weight:800}.top h1{font-size:25px;margin:0}.controls,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px rgba(25,45,65,.06)}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:14px;margin-bottom:14px}.field{min-width:190px;flex:1}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}select,input{width:100%;font:inherit;padding:10px;border:1px solid #bcc8d3;border-radius:9px;background:#fff}.note{font-size:12px;color:var(--muted);line-height:1.4}.status{padding:16px;text-align:center;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{padding:14px}.metric .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.metric .value{font-size:26px;font-weight:900;margin-top:5px}.metric .sub{font-size:12px;color:var(--muted);margin-top:4px}.section{padding:15px;margin-bottom:14px}.section h2{font-size:18px;margin:0 0 12px}.calendar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.month{border:1px solid var(--line);border-radius:11px;padding:10px}.month-title{text-align:center;font-weight:900;margin-bottom:8px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:10px;color:var(--muted);font-weight:800}.day{aspect-ratio:1;border-radius:6px;background:#f0f3f6;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8a95a1;position:relative}.day.empty{background:transparent}.day.worked{background:var(--green-bg);color:#136c35;border:1px solid #85c99b;font-weight:900}.day.hired{outline:2px solid var(--blue);outline-offset:1px}.day future{display:none}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}.dot.work{background:var(--green-bg);border:1px solid #85c99b}.dot.hire{border:2px solid var(--blue)}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{background:#f3f6f9;color:#4f5d6b;font-size:11px;text-transform:uppercase}th:first-child,td:first-child{text-align:left}.effective{font-weight:900;color:var(--blue)}.warning{background:var(--warn);border:1px solid #ead486;padding:10px;border-radius:9px;margin-bottom:12px;font-size:13px}.hidden{display:none!important}
    @media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.calendar-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.top h1{font-size:21px}.metrics,.calendar-grid{grid-template-columns:1fr}.metric .value{font-size:22px}.wrap{padding:12px 9px 35px}}
  </style>
</head>
<body>
<main class="wrap" id="app">
  <div class="top"><a class="back" href="admin.html">&#8592; Admin</a><h1>Payroll &amp; Attendance</h1></div>
  <div class="controls">
    <div class="field"><label for="employee">Employee</label><select id="employee"></select></div>
    <div class="field" id="rate-field"><label for="hourly-rate">Hourly rate</label><input id="hourly-rate" type="number" min="0" step=".25" placeholder="Enter rate"></div>
    <div class="field"><label>Take-home percentage</label><input value="84.54%" disabled></div>
  </div>
  <div id="status" class="card status">Loading Time Log...</div>
  <div id="content" class="hidden">
    <div id="missing-rate" class="warning hidden">Enter this employee's hourly rate above to calculate pay and effective hourly earnings. The rate is saved on this device.</div>
    <section class="metrics" id="metrics"></section>
    <section class="card section"><h2>Pay-period history</h2><div class="table-scroll"><table><thead><tr><th>Pay period</th><th>Hours</th><th>Regular</th><th>OT</th><th>Gross</th><th>Take home</th><th>Take-home / hr</th></tr></thead><tbody id="pay-body"></tbody></table></div></section>
    <section class="card section"><h2>Days worked</h2><div class="legend"><span><i class="dot work"></i>Worked</span><span><i class="dot hire"></i>First clock-in</span></div><div id="calendars" class="calendar-grid"></div></section>
  </div>
</main>
<script>
(function(){
  "use strict";
  var from=(new URLSearchParams(location.search).get("from")||"").toLowerCase();
  if(from!=="admin.html") { location.replace("index.html"); return; }

  var SHEET_ID="1gm39kMipfpLKS2n8g9F4SYG9Do36M_5Lc6GOs-c6jCM";
  var EMPLOYEES=["Michael","Alan","Jeff","Derick","Anthony","Jesse","Delvon"];
  var PAY={
    Michael:{type:"salary",gross:2000}, Jeff:{type:"salary",gross:3000},
    Alan:{type:"hourly",rate:18}, Jesse:{type:"hourly",rate:18}, Anthony:{type:"hourly",rate:22},
    Derick:{type:"hourly",rate:null}, Delvon:{type:"hourly",rate:null}
  };
  var NET=.8454, rows=[];
  var employeeEl=document.getElementById("employee"),rateEl=document.getElementById("hourly-rate"),rateField=document.getElementById("rate-field");
  EMPLOYEES.forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;employeeEl.appendChild(o)});
  employeeEl.value="Michael";

  function parseGviz(text){var a=text.indexOf("{");var b=text.lastIndexOf("}");if(a<0||b<a)throw new Error("Invalid sheet response");return JSON.parse(text.slice(a,b+1))}
  function dateFromCell(cell){
    if(!cell)return null;var v=cell.v;
    var m=/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/.exec(String(v==null?"":v));
    if(m)return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
    var d=new Date(v);if(isNaN(d))d=new Date(cell.f||"");return isNaN(d)?null:d;
  }
  function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function money(v){return v==null||!isFinite(v)?"—":v.toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2})}
  function num(v){return (+v||0).toFixed(2)}
  function median(a){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y}),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
  function mean(a){return a.length?a.reduce(function(s,v){return s+v},0)/a.length:0}
  function daysInclusive(a,b){var x=Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()),y=Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());return Math.max(1,Math.floor((y-x)/86400000)+1)}
  function periodEnd(key){var m=/^pp-(\d+)-(\d+)-(\d+)/.exec(key||"");return m?new Date(+m[1],+m[2]-1,+m[3],12):null}
  function periodLabel(key){var e=periodEnd(key);if(!e)return key;var s=new Date(e.getFullYear(),e.getMonth(),e.getDate()-13);return (s.getMonth()+1)+"/"+s.getDate()+"/"+s.getFullYear()+" – "+(e.getMonth()+1)+"/"+e.getDate()+"/"+e.getFullYear()}
  function storedRate(name){var base=PAY[name].rate;if(base!=null)return base;var v=Number(localStorage.getItem("payroll-rate:"+name));return isFinite(v)&&v>0?v:null}
  function payFor(p,name){
    var cfg=PAY[name];if(cfg.type==="salary"){p.gross=cfg.gross;p.net=p.gross*NET}
    else {var r=storedRate(name);p.gross=r==null?null:(p.regular*r+p.ot*r*1.5);p.net=p.gross==null?null:p.gross*NET}
    p.effective=p.net==null||!p.hours?null:p.net/p.hours;return p;
  }
  function buildPeriods(personRows,name){
    var map={};personRows.forEach(function(r){if(r.event!=="clock_out"||!r.period)return;var p=map[r.period]||(map[r.period]={key:r.period,hours:0});p.hours+=r.hours});
    return Object.keys(map).map(function(k){var p=map[k];p.regular=Math.min(80,p.hours);p.ot=Math.max(0,p.hours-80);return payFor(p,name)}).sort(function(a,b){return (periodEnd(b.key)||0)-(periodEnd(a.key)||0)});
  }
  function longestStreak(keys){var ds=Array.from(keys).map(function(k){return new Date(k+"T12:00:00")}).sort(function(a,b){return a-b}),best=0,run=0,last=null;ds.forEach(function(d){var diff=last?Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(last.getFullYear(),last.getMonth(),last.getDate()))/86400000):0;run=last&&diff===1?run+1:1;best=Math.max(best,run);last=d});return best}
  function metric(label,value,sub){return '<div class="card metric"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="sub">'+sub+'</div></div>'}
  function renderCalendar(first,worked){
    var out=document.getElementById("calendars");out.innerHTML="";if(!first)return;
    var now=new Date(),cursor=new Date(first.getFullYear(),first.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth(),1),names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    while(cursor<=last){var y=cursor.getFullYear(),m=cursor.getMonth(),count=new Date(y,m+1,0).getDate(),box=document.createElement("div");box.className="month";var html='<div class="month-title">'+cursor.toLocaleString("en-US",{month:"long",year:"numeric"})+'</div><div class="week">'+names.map(function(n){return"<div>"+n[0]+"</div>"}).join("")+'</div><div class="days">';for(var z=0;z<new Date(y,m,1).getDay();z++)html+='<div class="day empty"></div>';for(var d=1;d<=count;d++){var dt=new Date(y,m,d),key=dayKey(dt),cls="day"+(worked.has(key)?" worked":"")+(key===dayKey(first)?" hired":"");html+='<div class="'+cls+'" title="'+(worked.has(key)?"Worked ":"")+dt.toLocaleDateString()+'">'+d+'</div>'}html+='</div>';box.innerHTML=html;out.appendChild(box);cursor=new Date(y,m+1,1)}
  }
  function render(){
    var name=employeeEl.value,cfg=PAY[name],person=rows.filter(function(r){return r.employee===name}),clockIns=person.filter(function(r){return r.event==="clock_in"&&r.date}),first=clockIns.length?new Date(Math.min.apply(null,clockIns.map(function(r){return r.date.getTime()}))):null;
    rateField.classList.toggle("hidden",cfg.type==="salary");rateEl.value=cfg.type==="hourly"?(storedRate(name)||""):"";
    var periods=buildPeriods(person,name),worked=new Set();person.forEach(function(r){if(r.date&&(r.event==="clock_in"||r.event==="clock_out"))worked.add(dayKey(r.date))});
    var totalHours=periods.reduce(function(s,p){return s+p.hours},0),gross=periods.map(function(p){return p.gross}).filter(function(v){return v!=null}),net=periods.map(function(p){return p.net}).filter(function(v){return v!=null}),effective=periods.map(function(p){return p.effective}).filter(function(v){return v!=null}),totalGross=gross.reduce(function(s,v){return s+v},0),totalNet=net.reduce(function(s,v){return s+v},0),actualGrossHourly=totalHours&&gross.length?totalGross/totalHours:null,actualHourly=totalHours&&net.length?totalNet/totalHours:null,employed=first?daysInclusive(first,new Date()):0,avgDay=worked.size?totalHours/worked.size:0;
    document.getElementById("missing-rate").classList.toggle("hidden",cfg.type!=="hourly"||storedRate(name)!=null);
    document.getElementById("metrics").innerHTML=
      metric("Days worked",worked.size+(employed?" / "+employed:""),employed?((worked.size/employed*100).toFixed(1)+"% of calendar days since first clock-in"):"No first clock-in found")+
      metric("Total hours",num(totalHours),num(avgDay)+" average hours per worked day")+
      metric("Average take home",money(mean(net)),"Per recorded pay period")+
      metric("Median take home",money(median(net)),"Per recorded pay period")+
      metric("Actual gross / hour",money(actualGrossHourly),"Gross pay divided by total hours; includes overtime")+
      metric("Actual take-home / hour",money(actualHourly),"After deductions: total take-home divided by total hours")+
      metric("Median take-home / hr",money(median(effective)),"Less affected by unusually light or heavy periods")+
      metric("Total take home",money(totalNet),"84.54% of calculated gross pay")+
      metric("Longest work streak",longestStreak(worked)+" days",first?"First clock-in: "+first.toLocaleDateString():"No attendance data");
    var body=document.getElementById("pay-body");body.innerHTML="";periods.forEach(function(p){var tr=document.createElement("tr");tr.innerHTML="<td>"+periodLabel(p.key)+"</td><td>"+num(p.hours)+"</td><td>"+num(p.regular)+"</td><td>"+num(p.ot)+"</td><td>"+money(p.gross)+"</td><td>"+money(p.net)+"</td><td class='effective'>"+money(p.effective)+"</td>";body.appendChild(tr)});if(!periods.length)body.innerHTML='<tr><td colspan="7">No completed clock-out records.</td></tr>';
    renderCalendar(first,worked);
  }
  employeeEl.addEventListener("change",render);rateEl.addEventListener("change",function(){var n=employeeEl.value,v=Number(rateEl.value);if(isFinite(v)&&v>0)localStorage.setItem("payroll-rate:"+n,String(v));else localStorage.removeItem("payroll-rate:"+n);render()});
  var tq="select A, D, B, C, F where B is not null order by A";
  var url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?sheet="+encodeURIComponent("Time Log")+"&headers=1&tqx=out:json&tq="+encodeURIComponent(tq);
  fetch(url).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(text){var data=parseGviz(text);rows=(data.table.rows||[]).map(function(row){var c=row.c||[];return{date:dateFromCell(c[0]),period:String(c[1]&&c[1].v||""),employee:String(c[2]&&c[2].v||""),event:String(c[3]&&c[3].v||""),hours:Number(c[4]&&c[4].v||0)||0}});document.getElementById("status").classList.add("hidden");document.getElementById("content").classList.remove("hidden");render()}).catch(function(err){document.getElementById("status").textContent="Could not load Time Log. "+err.message});
})();
</script>
</body>
</html>
