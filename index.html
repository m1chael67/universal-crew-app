<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="logo_resized.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universal Crew App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <img src="logo_resized.png" alt="Universal Rentals Logo" style="max-height: 80px; display: block; margin: 0 auto 20px;" />
    <h2 style="text-align:center; color:#333;">Employee Log In</h2>
    <h1>Universal Crew App</h1>
    <form id="login-form" onsubmit="return handleLogin(event)">
      <input
        type="password"
        style="padding:10px;font-size:16px;width:100%;max-width:300px;margin:10px auto;display:block;"
        inputmode="numeric"
        pattern="[0-9]*"
        id="pin"
        maxlength="4"
        placeholder="Enter PIN"
        required
      />
      <button type="submit" style="padding:10px 20px;font-size:16px;background-color:#4b5320;color:#fff;border:none;border-radius:5px;cursor:pointer;display:block;margin:10px auto;">Login</button>
    </form>
  </div>

  <script>
    const EMPLOYEES = {
      "8080": "Michael",
      "0000": "Salim",
      "2027": "Alan",
      "1776": "ADMIN",
      "1391": "Joe",
      "1439": "Jeff"
      "5445": "Ben Winograd"
    };

    const EMPLOYEE_PAGES = {
      "Michael": "https://m1chael67.github.io/universal-crew-app/64445533.html",
      "Alan": "https://m1chael67.github.io/universal-crew-app/2555266.html",
      "Joe": "https://m1chael67.github.io/universal-crew-app/566633.html",
      "Jeff": "https://m1chael67.github.io/universal-crew-app/533333.html",
      "ADMIN": "https://m1chael67.github.io/universal-crew-app/admin.html",
      "Salim": "https://m1chael67.github.io/universal-crew-app/7777255546.html",
      "Ben Winograd": "https://m1chael67.github.io/universal-crew-app/ben_winograd.html"
    };

    function handleLogin(e) {
      e.preventDefault();

      const pinInput = document.getElementById('pin');
      const pin = pinInput.value.trim();
      const employeeName = EMPLOYEES[pin];

      if (!employeeName) {
        alert("Invalid PIN");
        pinInput.focus();
        pinInput.select();
        return false;
      }

      localStorage.setItem("employee", employeeName);
      localStorage.setItem("clockedIn", "true");

      const nextUrl = EMPLOYEE_PAGES[employeeName] || "https://m1chael67.github.io/universal-crew-app/jobs.html";
      window.location.href = nextUrl;
      return false;
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/universal-crew-app/service-worker.js');
    }
  </script>
</body>
</html>
