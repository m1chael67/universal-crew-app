<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Time Off History</title>
  <style>
    :root{--ink:#18212b;--muted:#657181;--line:#dce3ea;--bg:#f4f7fa;--card:#fff;--blue:#164a7b;--green:#1f7a43;--yellow:#946200;--red:#9b2c2c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 14px 48px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.top h1{margin:0;font-size:25px}.back{font-weight:900;color:var(--blue);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px rgba(25,45,65,.06)}.filters{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;padding:14px;margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}select{width:100%;font:inherit;padding:10px;border:1px solid #bdc8d2;border-radius:9px;background:#fff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{padding:14px}.metric .label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase}.metric .value{font-size:26px;font-weight:900;margin-top:5px}.section{padding:15px;margin-bottom:14px}.section h2{margin:0 0 12px;font-size:18px}.muted{color:var(--muted);font-size:13px}.coverage{display:grid;gap:8px}.coverage-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start}.coverage-date{min-width:125px;font-weight:900}.coverage-people{line-height:1.45;font-size:13px}.coverage-row.warning{background:#fff3d8;border-color:#e7c45e}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f3f6f9}.pill{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid}.pill.approved{color:var(--green);background:#e8f8ed;border-color:#8ac99e}.pill.pending{color:var(--yellow);background:#fff6da;border-color:#ddc06c}.pill.denied{color:var(--red);background:#fff0f0;border-color:#dfaaaa}.empty,.status{padding:18px;text-align:center;color:var(--muted)}.hidden{display:none!important}
    @media(max-width:760px){.filters,.metrics{grid-template-columns:repeat(2,1fr)}.coverage-row{display:block}.coverage-date{margin-bottom:5px}}
    @media(max-width:480px){.filters,.metrics{grid-template-columns:1fr}.top h1{font-size:22px}.wrap{padding:12px 9px 36px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="back" href="admin.html">&#8592; Admin</a><h1>Time Off History</h1></div>
  <section class="card filters">
    <div class="field"><label for="employee">Employee</label><select id="employee"><option value="">All employees</option></select></div>
    <div class="field"><label for="statusFilter">Status</label><select id="statusFilter"><option value="">All statuses</option><option>Pending</option><option>Approved</option><option>Denied</option></select></div>
    <div class="field"><label for="typeFilter">Request type</label><select id="typeFilter"><option value="">All types</option><option value="Days">Full days</option><option value="Late Start">Late start</option><option value="Early Leave">Early leave</option><option value="Partial Day">Partial day</option></select></div>
    <div class="field"><label for="periodFilter">When</label><select id="periodFilter"><option value="all">Past, present &amp; future</option><option value="current">Currently off</option><option value="future">Future</option><option value="past">Past</option></select></div>
  </section>
  <div id="status" class="card status">Loading time off requests...</div>
  <div id="content" class="hidden">
    <section class="metrics" id="metrics"></section>
    <section class="card section"><h2>Upcoming Staffing Coverage</h2><div id="coverage" class="coverage"></div></section>
    <section class="card section"><h2>Request History</h2><div class="table-scroll"><table><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Time</th><th>Status</th><th>Reason</th><th>Submitted</th></tr></thead><tbody id="requests"></tbody></table></div></section>
  </div>
</main>
<script>
(function(){
  "use strict";
  var from=(new URLSearchParams(location.search).get("from")||"").toLowerCase();
  if(from!=="admin.html"&&from!=="e4.html"){location.replace("index.html");return}
  var URL="https://script.google.com/macros/s/AKfycbwYof_0kk9wqNMWPrx-vlBeQ5Gwj8jMiDzwJOLphm5z50q72ZaNU-t4Oy0n-rEbbHMq/exec";
  var employees=["Michael","Alan","Jeff","Derick","Anthony","Jesse","Delvon","Albert"],requests=[];
  var employee=document.getElementById("employee"),statusFilter=document.getElementById("statusFilter"),typeFilter=document.getElementById("typeFilter"),periodFilter=document.getElementById("periodFilter");
  employees.forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;employee.appendChild(o)});
  function jsonp(params){return new Promise(function(resolve,reject){var cb="toh_"+Math.random().toString(16).slice(2),u=new URL(URL),s=document.createElement("script"),done=false,t=setTimeout(function(){finish();reject(new Error("Request timed out"))},20000);function finish(){if(done)return;done=true;clearTimeout(t);s.remove();try{delete window[cb]}catch(_){}}Object.keys(params).forEach(function(k){u.searchParams.set(k,params[k])});u.searchParams.set("callback",cb);window[cb]=function(d){finish();resolve(d||{})};s.onerror=function(){finish();reject(new Error("Could not load requests"))};s.src=u;document.body.appendChild(s)})}
  function parseDate(v){if(!v)return null;var s=String(v).trim(),m=s.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return new Date(+m[1],+m[2],+m[3],12);if(/^\d{4}-\d{2}-\d{2}$/.test(s)){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)}var d=new Date(s);return isNaN(d)?null:d}
  function day(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)}
  function start(r){return parseDate(r.RequestType==="Hours"?r.RequestDate:r.StartDate)}
  function end(r){return parseDate(r.RequestType==="Hours"?r.RequestDate:(r.EndDate||r.StartDate))}
  function fmtDate(v){var d=parseDate(v);return d?d.toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric",year:"2-digit"}):(v||"")}
  function time(v){if(!v)return"";var s=String(v).trim(),m=s.match(/^1899-12-30T(\d{2}):(\d{2})/);if(m){var h=(+m[1]+18)%24;return(h%12||12)+":"+m[2]+" "+(h>=12?"PM":"AM")}m=s.match(/^(\d{1,2}):(\d{2})/);if(m){var h2=+m[1];return(h2%12||12)+":"+m[2]+" "+(h2>=12?"PM":"AM")}return s}
  function timeText(r){if(r.RequestType!=="Hours")return"All day";var a=time(r.StartTime),b=time(r.EndTime);if(r.HoursType==="Late Start")return"Arrive "+b;if(r.HoursType==="Early Leave")return"Leave "+a;return a+(a&&b?" - ":"")+b}
  function dateText(r){if(r.RequestType==="Hours")return fmtDate(r.RequestDate);var a=fmtDate(r.StartDate),b=fmtDate(r.EndDate);return a+(r.EndDate&&r.EndDate!==r.StartDate?" - "+b:"")}
  function reqType(r){return r.RequestType==="Days"?"Full days":(r.HoursType||"Partial day")}
  function relation(r){var a=start(r),b=end(r),today=day(new Date());if(!a||!b)return"past";a=day(a);b=day(b);if(today<a)return"future";if(today>b)return"past";return"current"}
  function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function metric(label,value){return'<div class="card metric"><div class="label">'+label+'</div><div class="value">'+value+'</div></div>'}
  function filtered(){return requests.filter(function(r){var st=String(r.Status||"Pending"),typ=r.RequestType==="Days"?"Days":(r.HoursType||"Partial Day");return(!employee.value||r.Employee===employee.value)&&(!statusFilter.value||st===statusFilter.value)&&(!typeFilter.value||typ===typeFilter.value)&&(periodFilter.value==="all"||relation(r)===periodFilter.value)})}
  function renderCoverage(list){var box=document.getElementById("coverage"),today=day(new Date()),limit=new Date(today);limit.setDate(limit.getDate()+30);var map={};list.forEach(function(r){if(String(r.Status||"")!=="Approved")return;var a=start(r),b=end(r);if(!a||!b||day(b)<today||day(a)>limit)return;for(var d=new Date(Math.max(day(a),today));d<=b&&d<=limit;d.setDate(d.getDate()+1)){var k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();(map[k]||(map[k]={date:new Date(d),items:[]})).items.push(r)}});var days=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.date-b.date});box.innerHTML=days.length?days.map(function(x){var names=x.items.map(function(r){return"<strong>"+esc(r.Employee)+"</strong> — "+esc(timeText(r))}).join("<br>");return'<div class="coverage-row '+(x.items.length>1?"warning":"")+'"><div class="coverage-date">'+esc(x.date.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}))+'</div><div class="coverage-people">'+names+'</div></div>'}).join(""):'<div class="empty">No approved time off in the next 30 days.</div>'}
  function render(){var list=filtered().sort(function(a,b){return(start(b)||0)-(start(a)||0)}),current=list.filter(function(r){return relation(r)==="current"}).length,future=list.filter(function(r){return relation(r)==="future"}).length,pending=list.filter(function(r){return String(r.Status||"Pending")==="Pending"}).length,approved=list.filter(function(r){return String(r.Status||"")==="Approved"}).length;document.getElementById("metrics").innerHTML=metric("Currently off",current)+metric("Future requests",future)+metric("Pending",pending)+metric("Approved",approved);renderCoverage(list);var body=document.getElementById("requests");body.innerHTML=list.length?list.map(function(r){var st=String(r.Status||"Pending"),reason=r.Reason==="Other"?(r.OtherReason||"Other"):(r.Reason||"");return"<tr><td><strong>"+esc(r.Employee)+"</strong></td><td>"+esc(dateText(r))+"</td><td>"+esc(reqType(r))+"</td><td>"+esc(timeText(r))+"</td><td><span class='pill "+st.toLowerCase()+"'>"+esc(st)+"</span></td><td>"+esc(reason)+"</td><td>"+esc(fmtDate(r.SubmittedAt))+"</td></tr>"}).join(""):'<tr><td colspan="7" class="empty">No requests match these filters.</td></tr>'}
  [employee,statusFilter,typeFilter,periodFilter].forEach(function(el){el.addEventListener("change",render)});
  jsonp({action:"getTimeOffRequests"}).then(function(data){requests=data.requests||[];var known={};employees.forEach(function(n){known[n]=true});requests.forEach(function(r){var n=String(r.Employee||"").trim();if(n&&!known[n]){known[n]=true;var o=document.createElement("option");o.value=n;o.textContent=n;employee.appendChild(o)}});document.getElementById("status").classList.add("hidden");document.getElementById("content").classList.remove("hidden");render()}).catch(function(e){document.getElementById("status").textContent="Could not load time off requests. "+e.message});
})();
</script>
</body>
</html>
